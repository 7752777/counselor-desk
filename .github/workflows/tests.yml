name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: 4-suite test gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression
        run: pnpm run test:regression

      - name: Run import-loop
        run: pnpm run test:import-loop

      - name: Run crud-smoke
        run: pnpm run test:crud-smoke

      - name: Run student-import
        run: pnpm run test:student-import

      - name: Test summary
        if: success()
        run: echo "All 4 test suites passed"
