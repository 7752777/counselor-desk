name: macOS Desktop Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS universal package
    runs-on: macos-14
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source surface
        run: |
          pnpm run lint
          pnpm run check:public
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/sqlite-store.cjs

      - name: Build unsigned universal DMG and ZIP
        run: pnpm run desktop:build:mac

      - name: Verify package names and architectures
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find output/desktop -maxdepth 1 -type f -name '*-mac-universal.dmg' | head -n 1)"
          zip="$(find output/desktop -maxdepth 1 -type f -name '*-mac-universal.zip' | head -n 1)"
          test -n "$dmg"
          test -n "$zip"
          test -f "$dmg"
          test -f "$zip"
          work="${RUNNER_TEMP}/cwb-universal"
          rm -rf "$work"
          mkdir -p "$work"
          ditto -x -k "$zip" "$work"
          app_path="$(find "$work" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          binary="$app_path/Contents/MacOS/辅导员工作台"
          test -f "$binary"
          lipo -info "$binary" | tee "${RUNNER_TEMP}/cwb-lipo.txt"
          grep -q 'x86_64' "${RUNNER_TEMP}/cwb-lipo.txt"
          grep -q 'arm64' "${RUNNER_TEMP}/cwb-lipo.txt"
          plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist" | grep -qx 'cn.counselordesk.workbench'

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: counselor-desk-${{ github.sha }}-mac-universal
          if-no-files-found: error
          path: |
            output/desktop/*-mac-universal.dmg
            output/desktop/*-mac-universal.zip
