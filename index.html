<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="辅导员本地工作台 · 单文件离线运行 · 数据仅存本机">
<title>辅导员工作台</title>
<style>
/* ============================================================
   辅导员工作台 Counselor Desk  v3.2
   单文件 / 零依赖 / 数据仅存本机 localStorage
   设计：克制高级感 — 航空蓝调 · 纯色面 · 极细边框 · 柔和阴影
   ============================================================ */
:root{
  /* ===== 字体与排版（模块化阶梯，整体放大更通透） ===== */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --fs-display: 32px;
  --fs-h1: 24px;
  --fs-h2: 18px;
  --fs-h3: 16px;
  --fs-body: 15px;
  --fs-sm: 13.5px;
  --fs-xs: 12.5px;
  --fs-2xs: 11.5px;
  --lh-tight: 1.3;
  --lh-snug: 1.5;
  --lh-body: 1.66;
  --weight-rg: 400;
  --weight-md: 500;
  --weight-sb: 600;
  --weight-bd: 700;
  --track-tight: -0.01em;
  --track-wide: 0.04em;

  /* ===== 主色：深空航蓝 + 信号青（低空学院·工程科技风） ===== */
  --accent: #0b3a82;          /* 深空航蓝 — 主品牌色 */
  --accent-hover: #0a328f;
  --accent-active: #082a78;
  --accent-soft: #e8effb;     /* 极淡航蓝底 */
  --accent-line: #c7d6ef;
  --accent-dark: #072057;
  --accent-contrast: #ffffff;

  /* 信号青 — 链接 / 高亮 / 进度 */
  --signal: #0bb4c4;
  --signal-hover: #0aa2b1;
  --signal-soft: #e3f7f9;
  --signal-line: #a6e3e9;

  /* 琥珀 — 警示（弱化自 v3.7 的橙色，更金属感） */
  --amber: #e0a020;
  --amber-soft: #fdf3dc;
  --amber-line: #f1d99a;

  /* 翠绿 — 成功（保留 v3.7） */
  --emerald: #12a06b;

  /* ===== 文字层级（深空蓝调，统一蓝灰） ===== */
  --ink: #0a1326;
  --ink-2: #2a3852;
  --ink-3: #5a6779;
  --ink-4: #8a95a7;
  --ink-on-accent: #ffffff;

  /* ===== 表面与边界（极淡蓝灰 / 蓝图质感） ===== */
  --bg: #eef2f8;             /* 略深一档，凸显「蓝图底」 */
  --bg-sunken: #e6ecf5;
  --card: #ffffff;
  --card-2: #fafcff;
  --line: #dde4ef;
  --line-2: #ebf0f7;
  --line-strong: #c8d2e2;

  /* ===== 语义色（淡彩、降饱和） ===== */
  --danger: #e0413e; --danger-soft: #fdecec; --danger-line: #f6c9c8;
  --warn: #e0a020;   --warn-soft: #fdf3dc;   --warn-line: #f1d99a;
  --ok: #12a06b;     --ok-soft: #e7f7f0;     --ok-line: #aee7cf;
  --info: #0b3a82;

  /* ===== 顶栏 / 侧栏 浅色外壳（带蓝图细纹） ===== */
  --chrome-bg: #ffffff;
  --chrome-bg-2: #fafcff;
  --chrome-border: #dde4ef;
  --chrome-ink: #0a1326;
  --chrome-ink-2: #2a3852;
  --chrome-ink-3: #8a95a7;
  --chrome-hover: #eef3fc;
  --chrome-sub: #e6ecf5;

  /* ===== 蓝图网格（装饰用） ===== */
  --grid-color: rgba(11, 58, 130, 0.04);

  /* ===== 圆角（更圆润友好） ===== */
  --r-lg: 18px;
  --r: 13px;
  --r-sm: 10px;
  --r-xs: 7px;
  --r-pill: 999px;

  /* ===== 阴影（分层、轻柔通透） ===== */
  --sh: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05);
  --sh-xs: 0 1px 2px rgba(16,24,40,.04);
  --sh-sm: 0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.06);
  --sh-md: 0 6px 14px -3px rgba(16,24,40,.08), 0 14px 32px -8px rgba(16,24,40,.10);
  --sh-lg: 0 18px 44px -14px rgba(16,24,40,.18), 0 36px 80px -22px rgba(16,24,40,.22);
  --sh-kpi: 0 1px 3px rgba(16,24,40,.04), 0 8px 22px -8px rgba(16,24,40,.08);
  --sh-focus: 0 0 0 3px rgba(11,58,130,.26);

  /* ===== 动效 ===== */
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --dur-fast: 130ms;
  --dur: 200ms;
  --dur-slow: 320ms;

  /* ===== 间距（8pt 栅格） ===== */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  --nav-w: 256px;

  /* 渐变仅在品牌 mark 处使用 */
  --grad: linear-gradient(135deg,#0b3a82,#1d4ed8);
  --grad-warm: linear-gradient(135deg,#e0a020,#d98324);
  --grad-signal: linear-gradient(135deg,#0bb4c4,#0d8ce0);

  /* 兼容别名：旧 --navy 指向浅色外壳，避免遗留引用失效 */
  --navy: var(--chrome-bg);
  --navy-light: var(--chrome-bg-2);
  --navy-border: var(--chrome-border);
}

/* ===== 深色模式：深空蓝调（v3.8 工程蓝图暗色版） ===== */
[data-theme="dark"]{
  --bg: #0c1322;
  --bg-sunken: #080d18;
  --card: #131c2e;
  --card-2: #18223a;
  --line: #25324a;
  --line-2: #1c2640;
  --line-strong: #34446a;
  --ink: #eaf0fa;
  --ink-2: #b6c2d6;
  --ink-3: #8090a8;
  --ink-4: #5a6883;
  /* 深空航蓝提亮 → 蓝白（仍可读，仍有"航"感） */
  --accent: #4d7fd6;
  --accent-hover: #6a96e8;
  --accent-active: #3d6fc8;
  --accent-soft: rgba(77,127,214,.16);
  --accent-line: rgba(77,127,214,.36);
  --accent-dark: #4d7fd6;
  --accent-contrast: #0c1322;
  /* 信号青提亮 */
  --signal: #2dd0e0;
  --signal-hover: #4ddcec;
  --signal-soft: rgba(45,208,224,.14);
  --signal-line: rgba(45,208,224,.32);
  /* 琥珀提亮 */
  --amber: #f0b840;
  --amber-soft: rgba(240,184,64,.14);
  --amber-line: rgba(240,184,64,.32);
  --emerald: #3fd6a4;

  --danger: #ff807a; --danger-soft: rgba(255,128,122,.14); --danger-line: rgba(255,128,122,.32);
  --warn: #f0b840;   --warn-soft: rgba(240,184,64,.14);   --warn-line: rgba(240,184,64,.32);
  --ok: #3fd6a4;     --ok-soft: rgba(63,214,164,.14);     --ok-line: rgba(63,214,164,.32);
  --info: #4d7fd6;
  /* 浅色外壳在暗色下变为柔和炭蓝（工程蓝图暗色版） */
  --chrome-bg: #131c2e;
  --chrome-bg-2: #18223a;
  --chrome-border: #25324a;
  --chrome-ink: #eaf0fa;
  --chrome-ink-2: #b6c2d6;
  --chrome-ink-3: #8090a8;
  --chrome-hover: #1c2640;
  --chrome-sub: #1a2238;
  /* 蓝图网格（暗色更弱） */
  --grid-color: rgba(120, 160, 220, 0.05);
  --sh-xs: 0 1px 2px rgba(0,0,0,.35);
  --sh-sm: 0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.40);
  --sh-md: 0 8px 18px -4px rgba(0,0,0,.50), 0 16px 36px -10px rgba(0,0,0,.55);
  --sh-lg: 0 22px 54px -14px rgba(0,0,0,.60);
  --sh-kpi: 0 1px 3px rgba(0,0,0,.35), 0 10px 26px -10px rgba(0,0,0,.45);
  --sh-focus: 0 0 0 3px rgba(77,127,214,.40);
  --grad: linear-gradient(135deg,#3d6fc8,#4d7fd6);
  --grad-signal: linear-gradient(135deg,#2dd0e0,#4d7fd6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px;
  background-position: -1px -1px, -1px -1px;
  color:var(--ink); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--user-bg-image,none);background-position:center;background-size:cover;background-repeat:no-repeat;opacity:var(--user-bg-opacity,0);transition:opacity .25s ease}
body>*{position:relative;z-index:1}
/* 装饰性背景已移除 — 克制高级感 */
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
.hide{display:none !important}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}

/* ---------- 顶栏（浅色通透 + 工程蓝图底边） ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:var(--chrome-bg);
  border-bottom:1px solid var(--chrome-border);
  box-shadow:0 1px 0 rgba(11,58,130,.04), 0 2px 8px -4px rgba(11,58,130,.05);
  display:flex;align-items:center;gap:12px;padding:0 24px;height:60px;
  position:sticky;
}
.topbar::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--signal) 100%);
  opacity:.65;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap;color:var(--chrome-ink)}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:var(--grad);
  color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand-mark .ic{filter:none}
.brand-sub{font-size:11px;color:var(--accent-dark);font-weight:600;padding:3px 10px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line);letter-spacing:.4px;text-transform:uppercase}
.topbar-sp{flex:1}
.topbar-acts{display:flex;align-items:center;gap:8px}
.who{font-size:13px;color:var(--chrome-ink-2);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* ---------- 按钮（扁平、克制） ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:13.5px;font-weight:600;transition:all .15s ease;white-space:nowrap;
}
.btn:hover{background:var(--line-2);border-color:var(--line-strong)}
.btn:active{transform:scale(.98)}
.btn-primary{
  background:linear-gradient(180deg, var(--accent) 0%, var(--accent-active) 100%);
  border-color:var(--accent-active);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 1px 0 rgba(11,58,130,.10);
}
.btn-primary:hover{
  background:linear-gradient(180deg, var(--accent-hover) 0%, var(--accent) 100%);
  transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 6px 16px -4px rgba(11,58,130,.35);
}
.btn-danger{background:#fff;border-color:var(--danger-line);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(.92)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-icon{min-width:36px;padding:0 8px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn-ghost:hover{background:var(--line-2);color:var(--ink)}
/* 顶栏内按钮（浅色外壳）*/
.topbar .btn{background:var(--chrome-bg-2);border-color:var(--chrome-border);color:var(--chrome-ink-2);font-size:13px}
.topbar .btn:hover{background:var(--chrome-hover);color:var(--chrome-ink);border-color:var(--line-strong)}
/* 顶栏全局搜索 */
.topbar-search-wrap{position:relative;flex:1 1 260px;max-width:380px;min-width:0}
.topbar-search{display:flex;align-items:center;gap:7px;background:var(--chrome-bg-2);border:1px solid var(--chrome-border);
  border-radius:10px;padding:0 10px;height:38px;color:var(--chrome-ink-2);transition:background .15s ease,border-color .15s ease}
.topbar-search:focus-within{background:#fff;border-color:var(--accent-line);box-shadow:var(--sh-focus)}
.topbar-search .ic{color:var(--chrome-ink-3);flex:none}
.topbar-search .inp{background:transparent;border:none;outline:none;color:var(--chrome-ink);font-size:13.5px;flex:1;min-width:0;height:100%;padding:0}
.topbar-search .inp::placeholder{color:var(--chrome-ink-3)}
.topbar-search .gs-clear{flex:none;background:none;border:none;color:var(--chrome-ink-3);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.gs-panel{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:80;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.16);max-height:min(70vh,440px);overflow:auto;padding:6px}
.gs-group{font-size:11px;font-weight:700;color:var(--ink-4);letter-spacing:.5px;padding:8px 10px 4px;text-transform:uppercase}
.gs-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .12s ease}
.gs-item:hover,.gs-item.active{background:var(--accent-soft)}
.gs-ic{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.gs-ic .ic{width:15px;height:15px}
.gs-main{min-width:0;flex:1}
.gs-t{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-s{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-empty{padding:18px 10px;text-align:center;color:var(--ink-4);font-size:13px}
.gs-foot{font-size:11px;color:var(--ink-4);text-align:center;padding:7px;border-top:1px solid var(--line);margin-top:4px}
/* KPI 环比 */
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.kpi-delta.up{color:var(--ok)}
.kpi-delta.down{color:var(--danger)}
.kpi-delta.flat{color:var(--ink-4)}
.kpi-delta .ic{width:12px;height:12px}
/* 趋势图卡片 */
.trend-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.trend-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.trend-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- 布局 ---------- */
.layout{display:flex;align-items:flex-start;max-width:1720px;margin:0 auto}
.sidenav{
  width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:60px;
  height:calc(100vh - 60px);padding:18px 14px;overflow-y:auto;
  border-right:1px solid var(--chrome-border);
  background:var(--chrome-bg);
}
.nav-group{font-size:11px;font-weight:700;color:var(--chrome-ink-3);letter-spacing:.8px;padding:16px 12px 8px;text-transform:uppercase}
.nav-group:first-child{padding-top:2px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:0 12px;
  border-radius:10px;color:var(--chrome-ink-2);font-size:15px;font-weight:500;transition:all .15s var(--ease);margin-bottom:3px;
}
.nav-item:hover{background:var(--chrome-hover);color:var(--chrome-ink)}
.nav-item.on{
  background:linear-gradient(90deg, var(--accent) 0%, var(--accent-active) 100%);
  color:#ffffff;font-weight:600;
  box-shadow:0 1px 0 var(--accent-line), 0 4px 10px -2px rgba(11,58,130,.25);
}
.nav-item.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .ic{color:var(--chrome-ink-3);transition:color .15s}
.nav-item.on .ic{color:#ffffff}
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center}
.nav-badge.gray{background:var(--chrome-hover);color:var(--chrome-ink-3)}
.nav-foot{margin-top:18px;padding:16px 12px;border-radius:12px;background:var(--chrome-hover);border:1px solid var(--chrome-border);text-align:center;color:var(--chrome-ink-2);font-size:12.5px}
/* 侧边栏内搜索 */
.nav-search{display:flex;align-items:center;gap:7px;margin:0 2px 10px;padding:0 10px;height:38px;border-radius:10px;background:var(--chrome-bg-2);border:1px solid var(--chrome-border);color:var(--chrome-ink-2);transition:background .15s,border-color .15s}
.nav-search:focus-within{background:#fff;border-color:var(--accent-line);box-shadow:var(--sh-focus)}
.nav-search .ic{width:15px;height:15px;color:var(--chrome-ink-3);flex:none}
.nav-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--chrome-ink);font-size:13.5px}
.nav-search input::placeholder{color:var(--chrome-ink-3)}
/* 分组折叠 */
.nav-group{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.nav-fold-ic{width:14px;height:14px;color:var(--chrome-ink-3);transition:transform .18s ease;flex:none}
.nav-group.collapsed .nav-fold-ic{transform:rotate(-90deg)}
/* 常用钉住区 */
.nav-pinned{margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid var(--chrome-border)}
.nav-pinned .nav-group{padding-top:2px}
.nav-pinned .nav-group::after{content:'\2605';color:var(--accent);font-size:10px;margin-left:5px}
.nav-pin{margin-left:auto;width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--chrome-ink-3);cursor:pointer;opacity:0;transition:opacity .14s,color .14s;padding:0}
.nav-item:hover .nav-pin{opacity:.7}
.nav-pin:hover{color:var(--accent);opacity:1}
.nav-item.pinned .nav-pin{opacity:1;color:var(--accent)}
.nav-pin .ic{width:14px;height:14px}
/* B1 微交互：卡片 hover 边框反馈 */
.card:hover{border-color:var(--accent-line)}
/* B1 微交互：按钮点击涟漪 */
.btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:ripple .42s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

.main{flex:1;min-width:0;padding:24px 28px 56px}

/* ---------- 卡片（纯白、极细边框） ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;transition:box-shadow .2s ease}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card-hd{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:#fafbfc}
.card-hd h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.card-hd h2 .ic{color:var(--accent)}
.card-hd .sp{flex:1}
.card-bd{padding:18px 20px}
.card-bd.tight{padding:0}
.muted{color:var(--ink-3);font-size:13px}
.tiny{font-size:12px;color:var(--ink-4)}

/* ---------- 入场动效 ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.anim-in{animation:riseIn .5s cubic-bezier(.22,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.998)}to{opacity:1;transform:none}}
#main{animation:viewIn .38s ease both}

/* ---------- 今日待办（首屏核心） ---------- */
.today{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh-kpi);margin-bottom:16px;overflow:hidden}
.today-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.today-hd h2{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.2px;color:var(--ink)}
.today-hd h2 .ic{color:var(--accent)}
.today-date{font-size:12.5px;color:var(--ink-3);font-weight:500;background:var(--line-2);padding:3px 10px;border-radius:6px;border:1px solid var(--line)}
.today-stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:16px;border:1px solid;transition:all .12s ease}
.pill-danger{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.pill-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill-info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark)}
.pill-gray{background:var(--line-2);border-color:var(--line);color:var(--ink-3)}
.today-list{max-height:none}
.todo-row{display:flex;align-items:flex-start;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-2);transition:background .12s ease}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:var(--line-2)}
.todo-bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 3px;background:var(--line);transition:background .12s}
.todo-bar.d{background:var(--danger)} .todo-bar.w{background:var(--warn)} .todo-bar.i{background:var(--accent)}
.todo-main{flex:1;min-width:0}
.todo-t{font-weight:600;font-size:15px;line-height:1.5;word-break:break-word;color:var(--ink)}
.todo-m{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
.todo-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.empty{text-align:center;padding:40px 20px;color:var(--ink-4)}
.empty .ic{width:40px;height:40px;stroke-width:1.3;margin-bottom:10px;color:var(--line);opacity:.6}

/* ---------- 标签（纯色填充） ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap;border:none;transition:all .12s ease}
.tag-red{background:var(--danger-soft);color:var(--danger)}
.tag-amber{background:var(--warn-soft);color:var(--warn)}
.tag-green{background:var(--ok-soft);color:var(--ok)}
.tag-blue{background:var(--accent-soft);color:var(--accent-dark)}
.tag-purple{background:#f0e6ff;color:#7c3aed}
.tag-duty{background:#f8fafc;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line-2);background:#fafbfc}
.bulk-bar{display:flex;align-items:center;gap:8px;margin-left:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{
  width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;font-size:16px;transition:border-color .12s ease;outline:none;
}
@media (min-width:768px){.inp,select.inp,textarea.inp{font-size:13.5px}}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2.5px rgba(37,99,235,.1)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.6}
select.inp{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;padding-right:28px}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-4);pointer-events:none}
.search .inp{padding-left:30px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg button{padding:0 13px;height:36px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line);font-weight:500;transition:all .12s ease}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:inset 0 -2px 0 var(--signal)}

/* ---------- 表格 ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;padding:11px 14px;background:#f8f9fa;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1;letter-spacing:.2px;text-transform:uppercase}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink-2)}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:#fafbfc}
tbody tr:last-child td{border-bottom:none}
.td-acts{white-space:nowrap;text-align:right}
.row-danger{background:var(--danger-soft) !important}
.row-danger:hover{background:#fee2e2 !important}
.name-cell{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 32px}
.avatar.f{background:#ecfeff;color:#0891b2}
.link-btn{color:var(--accent);font-weight:600;font-size:12.5px}
.link-btn:hover{text-decoration:underline}
.link-btn.danger{color:var(--danger)}

/* 移动端卡片列表 */
.mcards{display:none}
.mcard{padding:15px 18px;border-bottom:1px solid var(--line-2);transition:background .14s ease}
.mcard:last-child{border-bottom:none}
.mcard-hd{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mcard-t{font-weight:700;font-size:14.8px;flex:1;min-width:0;word-break:break-word;color:var(--ink)}
.mcard-meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.mcard-acts{display:flex;gap:7px;flex-wrap:wrap}
/* Phase 4 参考类模块：卡片列表在桌面端也展示 */
.mcards.in{display:block}
.mcard-abs{font-size:13px;line-height:1.65;color:var(--ink-2);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.mcard-note{font-size:12px;color:var(--ink-4);margin-bottom:10px;background:var(--line-2);padding:7px 10px;border-radius:8px}
.mcard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag-cyan{background:#ecfeff;color:#0e7490}
.tag-line{background:var(--line-2);color:var(--ink-3)}

/* ---------- KPI（v3.8 工程感：左 3px 侧条 + 顶发丝线 + 标签字号放大） ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{
  background:var(--card);border:1px solid var(--line);
  border-top:1px solid var(--accent-line);
  border-radius:var(--r);padding:18px 20px 16px 22px;box-shadow:var(--sh-kpi);
  position:relative;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease;
}
.kpi:hover{box-shadow:0 6px 22px rgba(0,0,0,.06);transform:translateY(-1px)}
.kpi::after{content:'';position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.kpi.l::after{background:var(--ok)}
.kpi.w::after{background:var(--amber)}
.kpi.d::after{background:var(--danger)}
.kpi.brand::after{background:var(--accent)}
.kpi-l{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:9px;font-weight:600;line-height:1.4}
.kpi-v{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.kpi-s{font-size:12.5px;color:var(--ink-3);margin-top:6px;font-weight:500;line-height:1.4}
.kpi.danger .kpi-v{color:var(--danger)}
.kpi.warn .kpi-v{color:var(--warn)}
.kpi.ok .kpi-v{color:var(--ok)}
.kpi.brand .kpi-v{color:var(--accent)}

/* ---------- 弹窗（纯白、干净） ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:600px;max-height:90vh;
  display:flex;flex-direction:column;animation:pop .2s ease}
.modal.narrow{max-width:400px}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-hd h3{margin:0;font-size:16.5px;font-weight:700;flex:1;letter-spacing:.2px;color:var(--ink)}
.modal-bd{padding:20px;overflow-y:auto;flex:1}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.span2{grid-column:1/-1}
.form-row{margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 0}
.chk input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border:1px solid var(--line);border-radius:18px;font-size:12.5px;font-weight:500;
  background:#fff;color:var(--ink-3);transition:all .12s ease;min-height:32px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hint{font-size:12px;color:var(--ink-4);margin-top:5px;line-height:1.6}

/* ---------- Toast（纯色、干净） ---------- */
#toast-root{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{
  background:#1e293b;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
  display:flex;align-items:center;gap:7px;animation:tin .2s ease;max-width:100%}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)} .toast.warn{background:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- 提示条 ---------- */
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px;border:1px solid;font-weight:500}
.banner-warn{background:var(--warn-soft);border-color:var(--warn-line);color:#92400e}
.banner-info{background:var(--accent-soft);border-color:var(--accent-line);color:#1e3a5f}
.banner .sp{flex:1}

/* ---------- SVG 图表 ---------- */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.3px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.sub-hd{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.warn-donut-wrap{border-top:1px solid var(--line);margin-top:14px}
.insight{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.insight-danger{border-color:#fecaca;background:#fef2f2}
.insight-warn{border-color:#fde68a;background:#fffbeb}
.insight-ok{border-color:#bbf7d0;background:#f0fdf4}
.insight-t{font-size:12.5px;color:var(--ink-3);font-weight:600}
.insight-v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:5px 0 3px;color:var(--ink)}
.insight-danger .insight-v{color:var(--danger)}
.insight-warn .insight-v{color:var(--warn)}
.insight-ok .insight-v{color:var(--ok)}
.insight-s{font-size:12.5px;color:var(--ink-3)}
.insight-note{font-size:12px;color:var(--ink-4);margin-top:7px;line-height:1.5}
@keyframes drawBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-val{transform-origin:left;animation:drawBar .8s cubic-bezier(.22,.7,.3,1) both}
@keyframes donutIn{from{transform:scale(.92) rotate(-6deg);opacity:0}to{opacity:1;transform:none}}
.donut-anim{animation:donutIn .7s cubic-bezier(.22,.7,.3,1) both;transform-origin:center}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2.5px solid var(--accent);transition:border-color .15s ease}
.tl-d{font-size:12px;color:var(--ink-4);font-weight:600;letter-spacing:.3px}
.tl-c{font-size:13.5px;margin-top:4px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}

/* ---------- 左侧抽屉遮罩（移动端）---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:65;opacity:0;pointer-events:none;transition:opacity .28s ease;backdrop-filter:blur(3px)}

/* ---------- 底部 Tab（移动端）---------- */
.tabbar{display:none}

/* ---------- 移动端适配 ---------- */
@media (max-width:900px){
  :root{--nav-w:0px}
  .sidenav{position:fixed;top:0;left:0;bottom:0;z-index:66;width:276px;flex:none;
    background:var(--chrome-bg);box-shadow:8px 0 30px rgba(0,0,0,.2);transform:translateX(-104%);transition:transform .25s ease;height:100%;border-right:none}
  .sidenav.open{transform:none}
  .main{padding:14px 12px calc(80px + env(safe-area-inset-bottom))}
  .topbar{padding:0 14px;gap:8px;height:56px}
  .brand-sub,.who,.mo-hide{display:none}
  .brand{font-size:15.5px}
  .topbar-search-wrap{max-width:none;flex:1 1 120px}
  .tw{display:none}
  .mcards{display:block}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px 16px}
  .kpi-v{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .today-stats{width:100%;margin-left:0}
  .todo-row{flex-wrap:wrap}
  .todo-acts{width:100%;padding-left:16px;margin-top:8px}
  .btn{min-height:44px}
  .btn-sm{min-height:38px}
  .modal{max-height:92vh;border-radius:14px}
  .modal-ft{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;
    border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,.05);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:52px;font-size:11px;color:var(--ink-4);font-weight:500;position:relative;border-radius:10px;transition:all .12s ease}
  .tab.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
  .tab-dot{position:absolute;top:5px;right:calc(50% - 22px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
 }
@media (max-width:480px){
  .topbar{padding:0 12px}
  .topbar-search-wrap{display:none}
}
 @media (max-width:400px){ .kpis{grid-template-columns:1fr} }

/* ---------- 打印 ---------- */
@media print{
  .topbar,.sidenav,.tabbar,.toolbar,.todo-acts,.td-acts,.btn,.scrim{display:none !important}
  .main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}
details.adv{margin:0}
details.adv>summary{list-style:none;cursor:pointer;padding:13px 16px;background:#f7f8fa;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;user-select:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv>summary:hover{color:var(--ink)}
details.adv .adv-body{padding-top:14px}
/* ===================== v3.6 视觉与交互升级 ===================== */

/* 全局聚焦环（无障碍 / WCAG AA） */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
.btn:focus-visible,.chip:focus-visible,.nav-item:focus-visible,.nav-search:focus-within{outline-offset:2px}

/* 字体与基础排版 */
.btn{font-weight:var(--weight-sb);letter-spacing:.01em}
.card-hd h2{font-size:var(--fs-h2);font-weight:var(--weight-bd);letter-spacing:var(--track-tight)}
.modal-hd h3{font-size:var(--fs-h2);font-weight:var(--weight-bd);letter-spacing:var(--track-tight)}
.field label,.lab{font-size:var(--fs-sm);font-weight:var(--weight-sb);color:var(--ink-2);letter-spacing:.01em}
.muted{color:var(--ink-3);font-size:var(--fs-sm)}
.tiny{font-size:var(--fs-xs);color:var(--ink-4)}
.num,.kpi-v{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* 按钮：精致悬浮 / 按下 */
.btn-sm{min-height:34px}
.btn-primary{color:var(--accent-contrast);box-shadow:var(--sh-xs)}
.btn-primary:hover{background:var(--accent-hover);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}

/* 输入框：聚焦环 + 淡 tint */
.inp,select.inp,textarea.inp{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:var(--fs-body);color:var(--ink);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease)}
.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:var(--sh-focus);background:var(--card)}
.topbar-search .inp{border:none;background:transparent}

/* 卡片：双描边 + 悬浮抬升 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm), inset 0 1px 0 rgba(255,255,255,.7);margin-bottom:var(--sp-4);
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.card:hover{box-shadow:var(--sh-md), inset 0 1px 0 rgba(255,255,255,.7);border-color:var(--accent-line);transform:translateY(-2px)}
.card-hd{background:var(--card-2)}
.card-bd{padding:var(--sp-5)}
.today{background:var(--card)}
.insight{background:var(--card)}

/* 标签 / 药丸：更柔 */
.pill{font-weight:var(--weight-sb)}
.tag{font-weight:var(--weight-sb);letter-spacing:.01em}
.chip{background:var(--card-2)}

/* 表格：数字右对齐 + sticky 头 + 行 hover + 发丝分隔 */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-2)}
th{font-size:var(--fs-xs);font-weight:var(--weight-sb);color:var(--ink-3);text-transform:uppercase;letter-spacing:var(--track-wide);background:var(--card-2);position:sticky;top:0;z-index:1}
tbody tr{transition:background var(--dur-fast) var(--ease)}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}

/* 空状态：内联插画 + 引导 */
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 20px;color:var(--ink-4)}
.empty .ic{width:40px;height:40px;color:var(--ink-4);opacity:.5}
.empty div{font-size:var(--fs-sm);line-height:1.6}

/* 弹窗：更顺滑入场 + 主题化 */
.modal{background:var(--card);color:var(--ink);border-radius:var(--r-lg);box-shadow:var(--sh-lg);animation:pop var(--dur-slow) var(--ease-out)}
.mask{background:rgba(10,14,22,.42);animation:fade var(--dur) var(--ease)}
.toast{animation:tin var(--dur) var(--ease-out);font-weight:var(--weight-md);border-radius:var(--r-sm)}
.anim-in{animation:riseIn .55s var(--ease-out) both}

/* 选区 & 滚动条 */
::selection{background:var(--accent-soft);color:var(--accent-dark)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:3px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}

/* 骨架屏 */
.skeleton{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r-sm)}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* 深色模式补白表面 */
[data-theme="dark"] .card{box-shadow:var(--sh-sm), inset 0 1px 0 rgba(255,255,255,.04)}
[data-theme="dark"] .card:hover{box-shadow:var(--sh-md), inset 0 1px 0 rgba(255,255,255,.04)}
[data-theme="dark"] .inp, [data-theme="dark"] select.inp, [data-theme="dark"] textarea.inp{background:var(--card-2);border-color:var(--line-strong)}
[data-theme="dark"] .chip{background:var(--card-2);color:var(--ink-3);border-color:var(--line)}
[data-theme="dark"] .nav-item:hover{background:var(--chrome-hover)}
[data-theme="dark"] .btn-danger{background:var(--card-2);border-color:var(--danger-line);color:var(--danger)}
[data-theme="dark"] .btn-ok{color:#04231a}
[data-theme="dark"] .btn-primary{color:var(--accent-contrast)}

/* 尊重 reduce-motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
.onboarding{display:grid;grid-template-columns:1.2fr 1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--signal-soft));border:1px solid var(--accent-line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh-sm)}
.onboarding h2{margin:3px 0 5px;font-size:20px}.onboarding p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.65}.onboarding-steps{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-3)}.onboarding-steps span{padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.45)}.onboarding-steps .done{color:var(--ok);text-decoration:line-through}.onboarding-actions{display:flex;flex-direction:column;gap:7px;min-width:122px}.settings-section{border-top:1px solid var(--line-2);padding-top:16px;margin-top:18px}.learning-list{display:grid;gap:12px}.learning-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 16px;background:var(--card-2)}.learning-item-hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.learning-item h3{font-size:15px;margin:0 0 4px}.learning-item p{font-size:13.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;margin:10px 0}.learning-progress{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:10px 0}.learning-progress i{display:block;height:100%;background:var(--signal);border-radius:inherit}
@media (max-width:900px){.onboarding{grid-template-columns:1fr}.onboarding-actions{flex-direction:row;flex-wrap:wrap}.onboarding-actions .btn{flex:1}.settings-section .grid2{grid-template-columns:1fr}}
</style>

function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function shiftDay(dateStr, n) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function daysFromToday(dateStr) {
  if (!dateStr) return null;
  const a = new Date(dateStr + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function cnDate(dateStr) {
  if (!dateStr) return '';
  const p = dateStr.split('-');
  return p.length === 3 ? `${+p[1]}月${+p[2]}日` : dateStr;
}
function dueText(dateStr) {
  const d = daysFromToday(dateStr);
  if (d === null) return { t:'未设截止', cls:'tag' };
  if (d < 0)  return { t:`逾期 ${-d} 天`, cls:'tag-red' };
  if (d === 0) return { t:'今天截止', cls:'tag-red' };
  if (d === 1) return { t:'明天截止', cls:'tag-amber' };
  if (d <= 3) return { t:`还有 ${d} 天`, cls:'tag-amber' };
  return { t:`${cnDate(dateStr)} 截止`, cls:'tag' };
}
function monthOf(dateStr) { return (dateStr || '').slice(0, 7); }
function thisMonth() { return today().slice(0, 7); }
function termRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  if (m >= 3 && m <= 8) return { name:`${y} 春季学期`, from:`${y}-03-01`, to:`${y}-08-31` };
  if (m >= 9) return { name:`${y}-${y+1} 秋季学期`, from:`${y}-09-01`, to:`${y+1}-02-28` };
  return { name:`${y-1}-${y} 秋季学期`, from:`${y-1}-09-01`, to:`${y}-02-28` };
}
function weekRange() {
  const d = new Date(), day = d.getDay(), diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  const fmt = dt => dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
  return { name:`本周（${fmt(mon)} ~ ${fmt(sun)}）`, from:fmt(mon), to:fmt(sun) };
}
function monthRangeObj() {

}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: (mime || 'application/octet-stream') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function toCSV(rows) {
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function pinyinInitial(name) { return (name || '?').trim().slice(0, 1); }

/* ===================== 3. 数据层 store ===================== */
const NS = 'cwb_v1_';
const store = {
  read(key, fallback) {
    try { const raw = localStorage.getItem(NS + key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { console.warn('[CWB] 读取失败', key, e); return fallback; }
  },
  write(key, val) {
    try { localStorage.setItem(NS + key, JSON.stringify(val)); hooks.emit('store:write', { key, val }); return true; }
    catch (e) {
      ui.toast(e && e.name === 'QuotaExceededError'
        ? '本地存储空间已满，请先导出备份并清理旧数据' : '保存失败：' + e.message, 'err');
      return false;
    }
  },
  remove(key) { localStorage.removeItem(NS + key); },
  keys() { return Object.keys(localStorage).filter(k => k.startsWith(NS)).map(k => k.slice(NS.length)); },
  bytes() {
    let n = 0;
    this.keys().forEach(k => { n += (localStorage.getItem(NS + k) || '').length * 2; });
    return n;
  }
};

/* ===================== 5. UI 工具 ===================== */
const ui = {
  toast(msg, type, ms) {
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    const icon = type === 'ok' ? 'i-check' : type === 'err' ? 'i-alert' : type === 'warn' ? 'i-alert' : 'i-inbox';
    el.innerHTML = `<svg class="ic ic-sm"><use href="#${icon}"/></svg><span>${esc(msg)}</span>`;
    $('#toast-root').appendChild(el);
    setTimeout(() => { el.style.transition = '.25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, ms || 2400);
  },
  modal(opts) {
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = `
      <div class="modal ${opts.size || ''}" role="dialog" aria-modal="true">
        <div class="modal-hd">
          <h3>${esc(opts.title || '')}</h3>
          <button class="btn btn-ghost btn-icon" data-close aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-bd">${opts.body || ''}</div>
        ${opts.footer === null ? '' : `<div class="modal-ft">${opts.footer || '<button class="btn" data-close>关闭</button>'}</div>`}
      </div>`;
    $('#modal-root').appendChild(mask);
    const close = () => { mask.remove(); document.body.style.overflow = ''; };
    document.body.style.overflow = 'hidden';
    mask.addEventListener('click', e => {
      if (e.target === mask && !opts.sticky) close();
      if (e.target.closest('[data-close]')) close();
    });
    const onKey = e => { if (e.key === 'Escape' && !opts.sticky) { close(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
    if (opts.onOpen) opts.onOpen(mask, close);
    return close;
  },
  confirm(title, msg, onYes, danger) {
    ui.modal({
      title, size:'narrow', sticky:true,
      body:`<div style="font-size:14px;line-height:1.75;color:var(--ink-2)">${msg}</div>`,
      footer:`<button class="btn" data-close>取消</button>
              <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>确定</button>`,
      onOpen(mask, mClose) {
        $('[data-yes]', mask).onclick = () => { mClose(); onYes && onYes(); };
      }
    });
  },
  form(opts) {
    const fields = opts.fields, data = Object.assign({}, opts.data || {});
    const html = `<div class="grid2">` + fields.map(f => {
      const v = data[f.key] == null ? (f.def == null ? '' : f.def) : data[f.key];
      const span = (f.span === 2 || f.type === 'textarea' || f.type === 'chips') ? ' span2' : '';
      let ctl = '';
      if (f.type === 'select') {
        ctl = `<select class="inp" data-k="${f.key}">` +
          (f.options || []).map(o => {
            const val = typeof o === 'string' ? o : o.v;
            const lab = typeof o === 'string' ? o : o.n;
            return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`;
          }).join('') + `</select>`;
      } else if (f.type === 'textarea') {
        ctl = `<textarea class="inp" data-k="${f.key}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
      } else if (f.type === 'chips') {
        const arr = Array.isArray(v) ? v : [];
        ctl = `<div class="chips" data-chips="${f.key}">` + (f.options || []).map(o =>
          `<button type="button" class="chip${arr.includes(o.v) ? ' on' : ''}" data-v="${esc(o.v)}">${esc(o.n)}</button>`
        ).join('') + `</div>`;
      } else if (f.type === 'checkbox') {
        return `<div class="form-row${span}"><label class="chk">
          <input type="checkbox" data-k="${f.key}"${v ? ' checked' : ''}><span>${esc(f.label)}</span></label>
          ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
      } else {
        ctl = `<input class="inp" type="${f.type || 'text'}" data-k="${f.key}" value="${esc(v)}"
          placeholder="${esc(f.ph || '')}"${f.list ? ` list="${f.list}"` : ''}${f.type === 'number' ? ' inputmode="numeric"' : ''}>`;
      }
      return `<div class="form-row${span}">
        <label class="lab" style="display:block;margin-bottom:5px">${esc(f.label)}${f.required ? ' <span style="color:var(--danger)">*</span>' : ''}</label>
        ${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
    }).join('') + `</div>` + (opts.extra || '');

    const close = ui.modal({
      title: opts.title, size: opts.size, sticky: true,
      body: html,
      footer: `${opts.extraBtn || ''}<button class="btn" data-close>取消</button>
               <button class="btn btn-primary" data-ok>${esc(opts.okText || '保存')}</button>`,
      onOpen(mask, mClose) {
        $$('[data-chips]', mask).forEach(box => {
          box.addEventListener('click', e => {
            const b = e.target.closest('.chip'); if (!b) return;
            b.classList.toggle('on');
          });
        });
        const first = $('.inp', mask); if (first && window.innerWidth > 900) setTimeout(() => first.focus(), 60);
        $('[data-ok]', mask).onclick = () => {
          const out = {};
          $$('[data-k]', mask).forEach(el => {
            out[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value.trim();
          });
          $$('[data-chips]', mask).forEach(box => {
            out[box.dataset.chips] = $$('.chip.on', box).map(c => c.dataset.v);
          });
          const miss = fields.filter(f => f.required && !String(out[f.key] || '').trim());
          if (miss.length) { ui.toast('请填写：' + miss.map(m => m.label).join('、'), 'warn'); return; }
          if (opts.onSave(out) !== false) mClose();
        };
        if (opts.onOpen) opts.onOpen(mask, mClose);
      }
    });
    return close;
  }
};

/* ===================== 6. 事件钩子 ===================== */
const hooks = {
  _m: {},
  on(name, fn) { (this._m[name] = this._m[name] || []).push(fn); return this; },
  off(name, fn) { this._m[name] = (this._m[name] || []).filter(f => f !== fn); return this; },
  emit(name, payload) {
    (this._m[name] || []).forEach(fn => { try { fn(payload); } catch (e) { console.error('[CWB hook]', name, e); } });
    return this;
  }
};

      learning_sessions: scope.learning_sessions === false ? [] : DB.learning_sessions,
      custom: DB.custom,
      stats: this.stats(scope),
    };
  },
  stats(scope) {
    scope = scope || {};
    const inRange = d => (!scope.from || d >= scope.from) && (!scope.to || d <= scope.to);
    const byDuty = {};
    DUTIES.forEach(d => { byDuty[d.k] = { duty:d.k, duty_name:d.n, tasks:0, tasks_done:0, talks:0 }; });
    DB.tasks.forEach(t => {
      const d = t.due || (t.created_at || '').slice(0, 10);
      if (!inRange(d)) return;
      const b = byDuty[t.duty]; if (!b) return;
      b.tasks++; if (t.status === 'done') b.tasks_done++;
    });
    DB.talks.forEach(t => { if (inRange(t.date) && byDuty[t.duty]) byDuty[t.duty].talks++; });
    return {
      student_total: DB.students.length,
      focus_total: DB.students.filter(s => s.focus_level).length,
      crisis_total: DB.students.filter(s => s.crisis_level && !s.crisis_relieved).length,
      task_total: DB.tasks.length,
      task_done: DB.tasks.filter(t => t.status === 'done').length,
      talk_total: DB.talks.filter(t => inRange(t.date)).length,
      stay_total: DB.stay.length,
      leave_total: DB.leave.length,
      honor_total: DB.honor.length,
      pleave_total: DB.pleave.length,
      pleave_pending: DB.pleave.filter(p => p.status === '待审批').length,
      attend_total: DB.attend.length,
      node_total: DB.node.length,
      node_overdue: DB.node.filter(n => n.status !== 'done' && n.due && daysFromToday(n.due) < 0).length,
      warn_total: DB.warn.length,
      warn_active: DB.warn.filter(w => !w.resolved).length,
      warn_red: DB.warn.filter(w => !w.resolved && w.level === '红').length,
      help_total: DB.help.length,
      help_tracking: DB.help.filter(h => h.status !== '已结束').length,
      grant_total: DB.grant.length,
      grant_pending: DB.grant.filter(g => g.status !== '已发放').length,
      focus_total: DB.focus.length,
      focus_lvl1: DB.focus.filter(f => f.level === '一级' && f.status === '跟踪中').length,
      psych_total: DB.psych.length,
      psych_severe: DB.psych.filter(p => p.level === '重度' && p.status !== '已结案').length,
      graduate_total: DB.graduate.length,
      graduate_employed: DB.graduate.filter(g => g.employment_status !== '待就业' && g.employment_status !== '暂不就业').length,
      policy_total: DB.policy.length,
      policy_starred: DB.policy.filter(p => p.starred).length,
      material_total: DB.material.length,
      comp_total: DB.comp.length,
      comp_registered: DB.comp.filter(c => c.award !== '未参赛').length,
      tpl_total: DB.tpl.length,
      by_duty: Object.values(byDuty),
    };
  },
  applyPackage(pkg, mode) {
    if (!pkg || typeof pkg !== 'object') throw new Error('文件格式无法识别');
    const isPkg = pkg.package === 'counselor-desk';
    const src = isPkg ? pkg : (pkg.data || pkg);
    const S = Array.isArray(src.students) ? src.students : [];
    const T = Array.isArray(src.tasks) ? src.tasks : [];
    const K = Array.isArray(src.talks) ? src.talks : [];
    const ST = Array.isArray(src.stay) ? src.stay : [];
    const LV = Array.isArray(src.leave) ? src.leave : [];
    const HO = Array.isArray(src.honor) ? src.honor : [];
    const PL = Array.isArray(src.pleave) ? src.pleave : [];
    const AT = Array.isArray(src.attend) ? src.attend : [];
    const NO = Array.isArray(src.node) ? src.node : [];
    const WA = Array.isArray(src.warn) ? src.warn : [];
    const HP = Array.isArray(src.help) ? src.help : [];
    const GR = Array.isArray(src.grant) ? src.grant : [];
    const FO = Array.isArray(src.focus) ? src.focus : [];
    const PS = Array.isArray(src.psych) ? src.psych : [];
    const GD = Array.isArray(src.graduate) ? src.graduate : [];
    const PO = Array.isArray(src.policy) ? src.policy : [];
    const MA = Array.isArray(src.material) ? src.material : [];
    const CO = Array.isArray(src.comp) ? src.comp : [];
    const TP = Array.isArray(src.tpl) ? src.tpl : [];
    const LM = Array.isArray(src.learning_materials) ? src.learning_materials : [];
    const LN = Array.isArray(src.learning_notes) ? src.learning_notes : [];
    const LS = Array.isArray(src.learning_sessions) ? src.learning_sessions : [];
    /* 备份文件里会带上 settings（辅导员姓名、学院、带班信息、隐私锁等），换电脑恢复时不能丢 */
    const SET = (src.settings && typeof src.settings === 'object' && !Array.isArray(src.settings)) ? src.settings : null;
    if (!S.length && !T.length && !K.length && !ST.length && !LV.length && !HO.length && !PL.length && !AT.length && !NO.length
      && !WA.length && !HP.length && !GR.length && !FO.length && !PS.length && !GD.length
      && !PO.length && !MA.length && !CO.length && !TP.length && !LM.length && !LN.length && !LS.length && !SET) throw new Error('文件中没有可导入的数据');

    if (mode === 'replace') {
      DB.students = S.map(normStudent); DB.tasks = T.map(normTask); DB.talks = K.map(normTalk);
      DB.stay = ST.map(normStay); DB.leave = LV.map(normLeave); DB.honor = HO.map(normHonor);
      DB.pleave = PL.map(normPleave); DB.attend = AT.map(normAttend); DB.node = NO.map(normNode);
      DB.warn = WA.map(normWarn); DB.help = HP.map(normHelp); DB.grant = GR.map(normGrant);
      DB.focus = FO.map(normFocus); DB.psych = PS.map(normPsych); DB.graduate = GD.map(normGraduate);
      DB.policy = PO.map(normPolicy); DB.material = MA.map(normMaterial); DB.comp = CO.map(normComp); DB.tpl = TP.map(normTpl);
      DB.learning_materials = LM.map(normLearningMaterial); DB.learning_notes = LN.map(normLearningNote); DB.learning_sessions = LS.map(normLearningSession);
      if (src.custom) DB.custom = src.custom;
    } else {
      const sKey = x => x.student_number || x.id;
      const map = new Map(DB.students.map(x => [sKey(x), x]));
      S.forEach(x => { const k = sKey(x); map.has(k) ? Object.assign(map.get(k), x) : map.set(k, normStudent(x)); });
      DB.students = Array.from(map.values());
      const merge = (arr, incoming, norm) => {
        const m = new Map(arr.map(x => [x.id, x]));
        incoming.forEach(x => { const o = norm(x); m.has(o.id) ? Object.assign(m.get(o.id), o) : m.set(o.id, o); });
        return Array.from(m.values());
      };
      DB.tasks = merge(DB.tasks, T, normTask);
      DB.talks = merge(DB.talks, K, normTalk);
      DB.stay = merge(DB.stay, ST, normStay);
      DB.leave = merge(DB.leave, LV, normLeave);
      DB.honor = merge(DB.honor, HO, normHonor);
      DB.pleave = merge(DB.pleave, PL, normPleave);
      DB.attend = merge(DB.attend, AT, normAttend);
      DB.node = merge(DB.node, NO, normNode);
      DB.warn = merge(DB.warn, WA, normWarn);
      DB.help = merge(DB.help, HP, normHelp);
      DB.grant = merge(DB.grant, GR, normGrant);
      DB.focus = merge(DB.focus, FO, normFocus);
      DB.psych = merge(DB.psych, PS, normPsych);
      DB.graduate = merge(DB.graduate, GD, normGraduate);
      DB.policy = merge(DB.policy, PO, normPolicy);
      DB.material = merge(DB.material, MA, normMaterial);
      DB.comp = merge(DB.comp, CO, normComp);
      DB.tpl = merge(DB.tpl, TP, normTpl);
      DB.learning_materials = merge(DB.learning_materials, LM, normLearningMaterial);
      DB.learning_notes = merge(DB.learning_notes, LN, normLearningNote);
      DB.learning_sessions = merge(DB.learning_sessions, LS, normLearningSession);
    }
    if (isPkg && src.counselor && !DB.settings.counselor_name) {
      DB.settings.counselor_name = src.counselor.name || '';
      DB.settings.college_name = src.counselor.college_name || '';
      DB.settings.org_code = src.counselor.org_code || '';
    }
    /* 备份恢复：覆盖模式整体还原设置；合并模式只补本机还空着的项，不覆盖你现在填好的 */
    let setRestored = 0;
    if (!isPkg && SET) {
      if (mode === 'replace') { DB.settings = Object.assign({}, DB.settings, SET); setRestored = 1; }
      else {
        Object.keys(SET).forEach(k => {
          const cur = DB.settings[k];
          if (cur === '' || cur === undefined || cur === null) { DB.settings[k] = SET[k]; setRestored = 1; }
        });
      }
    }
    save();
    return { students:S.length, tasks:T.length, talks:K.length, stay:ST.length, leave:LV.length, honor:HO.length,
      pleave:PL.length, attend:AT.length, node:NO.length, warn:WA.length, help:HP.length, grant:GR.length,
      focus:FO.length, psych:PS.length, graduate:GD.length,
      policy:PO.length, material:MA.length, comp:CO.length, tpl:TP.length,
      learning_materials:LM.length, learning_notes:LN.length, learning_sessions:LS.length, settings:setRestored };
  },
  get baseUrl() { return (DB.settings.platform_url || '').replace(/\/$/, ''); },
  get enabled() { return !!this.baseUrl && !!DB.settings.platform_api_on; },
  async request(path, init) {
    if (!this.baseUrl) throw new Error('未配置平台地址');
    const res = await fetch(this.baseUrl + path, Object.assign({
      credentials:'include', headers:{ 'Content-Type':'application/json' }
    }, init || {}));
    if (!res.ok) throw new Error('平台返回 ' + res.status);
    return res.json();
  },
  async pullTasks() {
    const data = await this.request('/api/collection/assignments');
    const list = (data.items || data.assignments || []);
    let added = 0;
    list.forEach(a => {
      const ref = String(a.id || a.assignmentId || '');
      if (!ref || DB.tasks.some(t => t.platform_ref === ref)) return;
      DB.tasks.push(normTask({
        title: a.title || a.taskTitle || '平台任务',
        source: '平台下发', duty: 'daily', priority: 'P1',
        due: (a.dueAt || a.due_at || '').slice(0, 10),
        platform_ref: ref, note: a.description || '',
      }));
      added++;
    });
    if (added) save('tasks');
    return added;
  },
  async pushSummary(scope) {
    return this.request('/api/local-desk/summary', { method:'POST', body: JSON.stringify(this.buildPackage(scope)) });
  }
};

function cloneData(value) {
  return JSON.parse(JSON.stringify(value));
}
function demoRowKey(row) {
  const copy = cloneData(row);
  delete copy.id;
  delete copy.created_at;
  delete copy.updated_at;
  return JSON.stringify(copy);
}
function restoreDemo() {
  const current = { settings: cloneData(DB.settings), custom: cloneData(DB.custom) };
  DEMO_COLLECTIONS.forEach(collection => { current[collection] = cloneData(DB[collection] || []); });

  seedDemo();
  const demo = { settings: cloneData(DB.settings), custom: cloneData(DB.custom) };
  DEMO_COLLECTIONS.forEach(collection => { demo[collection] = cloneData(DB[collection] || []); });

  DB.settings = Object.assign({}, demo.settings, current.settings, { seeded: true });
  DEMO_COLLECTIONS.forEach(collection => {
    const preserved = current[collection] || [];
    const seen = new Set(preserved.map(demoRowKey));
    const additions = (demo[collection] || []).filter(row => {
      const key = demoRowKey(row);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    DB[collection] = preserved.concat(additions);
  });
  DB.custom = current.custom || {};
  save();
  render();
  paintWho();
  ui.toast('示例数据已恢复，原有记录未覆盖', 'ok');
}

/* ---------- 11.1 内联 SVG 图表 ---------- */
function hBarChart(items, opt) {
  opt = opt || {};
  const W = 680, rowH = 30, padL = opt.padL || 92, padR = 54, top = 6;
  const H = top * 2 + Math.max(1, items.length) * rowH;
  const max = Math.max(1, ...items.map(i => i.value));
  const bw = W - padL - padR;
  let g = '';
  items.forEach((it, i) => {
    const y = top + i * rowH, len = Math.max(it.value > 0 ? 3 : 0, (it.value / max) * bw);
    g += `<text x="${padL - 8}" y="${y + 19}" text-anchor="end" font-size="12" fill="#64748b">${esc(it.label)}</text>
      <rect x="${padL}" y="${y + 7}" width="${bw}" height="15" rx="4" fill="#e0f2fe"/>
      <rect class="bar-val" x="${padL}" y="${y + 7}" width="${len.toFixed(1)}" height="15" rx="4" fill="${it.color || '#4f46e5'}"><title>${esc(it.label)}：${it.value}</title></rect>
      <text x="${padL + len + 8}" y="${y + 19}" font-size="12" font-weight="700" fill="${it.value ? '#0f172a' : '#cbd5e1'}">${it.value}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="分类统计柱状图">${g}</svg></div>`;
}
function donutChart(items, centerTop, centerSub) {
  const total = items.reduce((a, b) => a + b.value, 0);
  const R = 54, C = 2 * Math.PI * R, cx = 70, cy = 70;
  let off = 0, ring = '';
  if (total > 0) {
    items.forEach(it => {
      if (!it.value) return;
      const len = (it.value / total) * C;
      ring += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${it.color}" stroke-width="20"
        stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"><title>${esc(it.label)}：${it.value}</title></circle>`;
      off += len;
    });
  } else {

/* ---------- 11.1b 折线图 ---------- */
function lineChart(series, opt) {
  opt = opt || {};
  const W = 680, H = opt.height || 220, padL = 34, padR = 14, padT = 14, padB = 26;
  const labels = opt.labels || [];
  const n = labels.length;
  const all = series.flatMap(s => s.data);
  const max = opt.max || Math.max(1, ...all);
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const x = i => n <= 1 ? padL + innerW / 2 : padL + (i / (n - 1)) * innerW;
  const y = v => padT + innerH - (v / max) * innerH;
  let g = '';
  const rows = 4;
  for (let r = 0; r <= rows; r++) {
    const gy = padT + (r / rows) * innerH;
    g += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#eef2f7" stroke-width="1"/>`;
    g += `<text x="${padL - 6}" y="${gy + 3}" text-anchor="end" font-size="10" fill="#94a3b8">${Math.round(max * (1 - r / rows))}</text>`;
  }
  labels.forEach((lb, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#94a3b8">${esc(lb)}</text>`; });
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const base = (padT + innerH).toFixed(1);
    const area = `M${x(0).toFixed(1)},${base} ` + s.data.map((v, i) => `L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ') + ` L${x(s.data.length - 1).toFixed(1)},${base} Z`;
    g += `<path d="${area}" fill="${s.color}" opacity="0.07"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.data.forEach((v, i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} · ${esc(labels[i])}：${v}</title></circle>`; });
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="趋势折线图">${g}</svg></div>`;
}
function lastMonths(n) {
  const out = [], d = new Date();
  for (let i = n - 1; i >= 0; i--) { const dt = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(dt.getFullYear() + '-' + pad(dt.getMonth() + 1)); }
  return out;
}
function lastMonth() { const d = new Date(); const dt = new Date(d.getFullYear(), d.getMonth() - 1, 1); return dt.getFullYear() + '-' + pad(dt.getMonth() + 1); }

function dutyBars(range) {
  const st = bridge.stats({ from: range.from, to: range.to });
  const items = st.by_duty.map(b => {
    const d = DUTY_MAP[b.duty];
    return { label: d.s, value: b.tasks + b.talks, color: d.c };
  });
  if (!items.some(i => i.value)) return emptyBox('本学期暂无记录，去任务台或谈话记录里添几条试试。');
  return hBarChart(items) + `<div class="legend"><span>统计口径：任务条数 + 谈话次数，按截止日期 / 谈话日期归入区间</span></div>`;
}

function filterTasks() {
  const f = app.filters.tasks;
  return DB.tasks.filter(t => {
    if (f.status === 'open' && t.status === 'done') return false;
    if (f.status === 'done' && t.status !== 'done') return false;
    if (f.duty && t.duty !== f.duty) return false;
    if (f.q) {
      const s = (t.title + t.note + t.classes + t.source).toLowerCase();
      if (!s.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => {
    if ((a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
    const ad = a.due || '9999', bd = b.due || '9999';
    return ad === bd ? (a.priority > b.priority ? 1 : -1) : (ad < bd ? -1 : 1);
  });
}

function statusTag(st) {
  if (st === '已通过') return '<span class="tag tag-green">已通过</span>';
  if (st === '已驳回') return '<span class="tag tag-red">已驳回</span>';
  if (st === '待审批') return '<span class="tag tag-amber">待审批</span>';
  if (st === 'done' || st === '已完成') return '<span class="tag tag-green">已完成</span>';
  if (st === 'doing' || st === '进行中') return '<span class="tag tag-blue">进行中</span>';
  if (st === 'todo' || st === '待办') return '<span class="tag tag-amber">待办</span>';
  return '<span class="tag">' + esc(st || '') + '</span>';
}

function buildSummary(R) {
  const st = bridge.stats({ from:R.from, to:R.to });
  const talks = DB.talks.filter(t => t.date >= R.from && t.date <= R.to);
  const tasks = DB.tasks.filter(t => { const d = t.due || (t.created_at || '').slice(0, 10); return d >= R.from && d <= R.to; });
  const who = DB.settings.counselor_name || '本人';
  const L = [];
  L.push(`${R.name}辅导员工作小结`);
  L.push('');
  L.push(`辅导员：${who}${DB.settings.college_name ? '（' + DB.settings.college_name + '）' : ''}`);
  L.push(`统计区间：${R.from} 至 ${R.to}`);
  L.push(`带班学生：${st.student_total} 人，其中纳入重点关注 ${st.focus_total} 人，心理危机预警未解除 ${st.crisis_total} 人。`);
  L.push('');
  L.push('一、工作总量');
  L.push(`本区间共承接和推进各类工作任务 ${st.task_total} 项，已完成 ${st.task_done} 项；开展谈心谈话 ${talks.length} 人次，覆盖学生 ${new Set(talks.map(t => t.student_name)).size} 名；校外住宿（走读）${st.stay_total} 人、假期去向跟踪 ${st.leave_total} 人、评优榜样申报 ${st.honor_total} 人。`);
  L.push('');
  L.push('二、按九项工作职责开展情况');
  st.by_duty.forEach((b, i) => {
    if (!b.tasks && !b.talks) return;
    const items = tasks.filter(t => t.duty === b.duty).slice(0, 3).map(t => t.title);
    L.push(`${i + 1}. ${b.duty_name}：任务 ${b.tasks} 项（完成 ${b.tasks_done} 项），谈话 ${b.talks} 人次。${items.length ? '主要工作包括' + items.join('、') + '等。' : ''}`);
  });
  L.push('');
  L.push('三、重点学生关注情况');
  const foc = DB.students.filter(s => s.focus_level);
  if (foc.length) {
    LEVELS.filter(l => l.k).forEach(l => {
      const g = foc.filter(s => s.focus_level === l.k);
      if (g.length) L.push(`${l.n}：${g.length} 人（${g.map(s => s.full_name).join('、')}），${l.desc}。`);
    });
    const types = {};
    foc.forEach(s => (s.focus || []).forEach(f => { types[f] = (types[f] || 0) + 1; }));
    const td = Object.keys(types).map(k => `${FOCUS_MAP[k] ? FOCUS_MAP[k].n : k} ${types[k]} 人`).join('，');
    if (td) L.push(`关注类型分布：${td}。`);
  } else L.push('本区间无纳入重点关注的学生。');
  const crisis = DB.students.filter(s => s.crisis_level && !s.crisis_relieved);
  if (crisis.length) L.push(`心理危机预警（未解除）：${crisis.map(s => `${s.full_name}（${s.crisis_level}，${s.crisis_way || '来源未填'}）`).join('、')}。`);
  L.push('');
  L.push('四、下一步计划');
  const undone = DB.tasks.filter(t => t.status !== 'done').slice(0, 5);
  L.push(undone.length
    ? undone.map((t, i) => `${i + 1}）${t.title}${t.due ? `（${t.due} 前完成）` : ''}`).join('\n')
    : '按学院统一部署推进各项工作。');
  return L.join('\n');
}

function importStudentsCSV(text) {
  const rows = parseCSV(text);

      .map(n => { const hit = FOCUS.find(f => f.n === n || f.k === n); return hit ? hit.k : null; }).filter(Boolean);
    const ex = DB.students.find(s => s.student_number && s.student_number === o.student_number);
