<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="辅导员本地工作台 · 单文件离线运行 · 数据仅存本机">
<title>辅导员工作台</title>
<style>
/* ============================================================
   辅导员工作台 Counselor Desk  v2.1.0
   单文件 / 零依赖 / 数据仅存本机 localStorage
   设计：现代质感 + 微动效（无外部资源）
   ============================================================ */
:root{
  --brand:#5b51dd; --brand-2:#7c73ef; --brand-dark:#4338ca; --brand-soft:#eef1ff; --brand-line:#c7d2fe;
  --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
  --line:#e9edf3; --line-2:#f4f6fb; --bg:#f8f9fd; --card:#ffffff;
  --danger:#e11d48; --danger-soft:#fff1f3; --danger-line:#fecdd3;
  --warn:#d97706; --warn-soft:#fffbeb; --warn-line:#fde68a;
  --ok:#10b981; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --purple:#8b5cf6; --purple-soft:#faf5ff;
  --r:16px; --r-sm:10px; --r-xs:8px;
  --sh:0 1px 3px rgba(15,23,42,.04),0 4px 20px rgba(15,23,42,.04);
  --sh-lg:0 24px 60px rgba(15,23,42,.12);
  --sh-kpi:0 2px 12px rgba(91,81,221,.08);
  --nav-w:240px;
  --grad:linear-gradient(135deg,#5b51dd,#8b5cf6);
  --grad-warm:linear-gradient(135deg,#f97316,#ec4899);
  --grad-ocean:linear-gradient(135deg,#0891b2,#06b6d4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 100% -8%, rgba(91,81,221,.10) 0%, transparent 55%),
    radial-gradient(ellipse 700px 400px at -6% 4%, rgba(139,92,246,.08) 0%, transparent 50%),
    linear-gradient(180deg, #f8f9fd 0%, #f1f3f9 100%);
  color:var(--ink); font-size:14px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background-attachment:fixed;
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
.hide{display:none !important}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(226,232,240,.7);
  display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16.5px;letter-spacing:.3px;white-space:nowrap;color:var(--ink)}
.brand-mark{
  width:34px;height:34px;border-radius:11px;background:var(--grad);
  color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(91,81,221,.32), inset 0 -2px 4px rgba(0,0,0,.08);
  position:relative;overflow:hidden;
}
.brand-mark::after{content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;border-radius:13px;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent);pointer-events:none}
.brand-sub{font-size:10.5px;color:var(--ink-4);font-weight:600;padding:3px 10px;border-radius:20px;background:var(--line-2);border:1px solid var(--line);letter-spacing:.5px;text-transform:uppercase}
.topbar-sp{flex:1}
.topbar-acts{display:flex;align-items:center;gap:8px}
.who{font-size:12.8px;color:var(--ink-3);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 15px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:13px;font-weight:600;transition:all .18s cubic-bezier(.22,.7,.3,1);white-space:nowrap;
  position:relative;overflow:hidden;
}
.btn:hover{background:var(--line-2);border-color:#cbd5e1;transform:translateY(-1.5px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(91,81,221,.26)}
.btn-primary:hover{box-shadow:0 8px 24px rgba(91,81,221,.38);filter:saturate(1.08);transform:translateY(-2px)}
.btn-danger{background:#fff;border-color:var(--danger-line);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);transform:translateY(-1.5px)}
.btn-ok{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.20)}
.btn-ok:hover{filter:brightness(1.04);transform:translateY(-1.5px)}
.btn-sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn-icon{min-width:38px;padding:0 9px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn-ghost:hover{background:var(--line-2);color:var(--ink)}

/* ---------- 布局 ---------- */
.layout{display:flex;align-items:flex-start;max-width:1680px;margin:0 auto}
.sidenav{
  width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:60px;
  height:calc(100vh - 60px);padding:20px 14px;overflow-y:auto;
  border-right:1px solid rgba(226,232,240,.6);
  background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
}
.nav-group{font-size:10.5px;font-weight:800;color:var(--ink-4);letter-spacing:1.2px;padding:16px 12px 8px;text-transform:uppercase}
.nav-group:first-child{padding-top:6px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:0 13px;
  border-radius:11px;color:var(--ink-2);font-size:14px;font-weight:600;transition:all .18s cubic-bezier(.22,.7,.3,1);margin-bottom:3px;overflow:hidden;
}
.nav-item:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);width:3px;height:20px;border-radius:3px;background:var(--grad);transition:transform .22s cubic-bezier(.22,.7,.3,1)}
.nav-item:hover{background:rgba(91,81,221,.05)}
.nav-item.on{background:linear-gradient(135deg,rgba(91,81,221,.09),rgba(139,92,246,.07));color:var(--brand-dark);font-weight:700}
.nav-item.on:before{transform:translateY(-50%) scaleY(1)}
.nav-item .ic{color:var(--ink-4);transition:color .18s}
.nav-item.on .ic{color:var(--brand)}
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:19px;padding:0 6px;border-radius:20px;
  background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(225,29,72,.25)}
.nav-badge.gray{background:var(--line-2);color:var(--ink-3);border:1px solid var(--line);box-shadow:none}
.nav-foot{margin-top:20px;padding:16px 14px;border-radius:14px;background:linear-gradient(145deg,var(--brand-soft),rgba(139,92,246,.04));border:1px solid rgba(91,81,221,.08);text-align:center}

.main{flex:1;min-width:0;padding:20px 22px 48px}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid rgba(226,232,240,.7);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden;transition:box-shadow .2s ease}
.card:hover{box-shadow:0 4px 24px rgba(15,23,42,.07)}
.card-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:linear-gradient(180deg,#fff,#fafbff)}
.card-hd h2{margin:0;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.card-hd h2 .ic{color:var(--brand)}
.card-hd .sp{flex:1}
.card-bd{padding:18px 20px}
.card-bd.tight{padding:0}
.muted{color:var(--ink-3);font-size:13px}
.tiny{font-size:12px;color:var(--ink-4)}

/* ---------- 入场动效 ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.anim-in{animation:riseIn .5s cubic-bezier(.22,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.998)}to{opacity:1;transform:none}}
#main{animation:viewIn .38s ease both}

/* ---------- 今日待办 ---------- */
.today{border:1px solid rgba(226,232,240,.7);border-radius:var(--r);background:linear-gradient(180deg,#fff,#fafbff);box-shadow:var(--sh-kpi);margin-bottom:18px;overflow:hidden}
.today-hd{display:flex;align-items:center;gap:10px;padding:15px 20px;background:linear-gradient(135deg,rgba(91,81,221,.06),rgba(139,92,246,.06));border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.today-hd h2{margin:0;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.today-hd h2 .ic{color:var(--brand)}
.today-date{font-size:12.5px;color:var(--ink-3);font-weight:600;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:8px;border:1px solid var(--line)}
.today-stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid;transition:all .14s ease}
.pill-danger{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(239,68,68,.05));border-color:var(--danger-line);color:var(--danger)}
.pill-warn{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.05));border-color:var(--warn-line);color:var(--warn)}
.pill-ok{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.05));border-color:var(--ok-line);color:var(--ok)}
.pill-info{background:linear-gradient(135deg,rgba(91,81,221,.08),rgba(91,81,221,.04));border-color:var(--brand-line);color:var(--brand-dark)}
.pill-gray{background:var(--line-2);border-color:var(--line);color:var(--ink-3)}
.today-list{max-height:none}
.todo-row{display:flex;align-items:flex-start;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-2);transition:all .15s ease}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:linear-gradient(135deg,rgba(91,81,221,.02),rgba(139,92,246,.02))}
.todo-bar{width:3.5px;align-self:stretch;border-radius:4px;flex:0 0 3.5px;background:var(--line);transition:background .15s}
.todo-bar.d{background:linear-gradient(180deg,var(--danger),#f87171)} .todo-bar.w{background:linear-gradient(180deg,var(--warn),#fbbf24)} .todo-bar.i{background:linear-gradient(180deg,var(--brand),var(--purple))}
.todo-main{flex:1;min-width:0}
.todo-t{font-weight:700;font-size:14px;line-height:1.5;word-break:break-word;color:var(--ink)}
.todo-m{font-size:12.5px;color:var(--ink-3);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.todo-acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.empty{text-align:center;padding:40px 20px;color:var(--ink-4)}
.empty .ic{width:40px;height:40px;stroke-width:1.3;margin-bottom:10px;color:var(--line);opacity:.6}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:8px;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap;border:1px solid transparent;transition:all .14s ease}
.tag-red{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.04));color:var(--danger);border-color:var(--danger-line)}
.tag-amber{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.04));color:var(--warn);border-color:var(--warn-line)}
.tag-green{background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.04));color:var(--ok);border-color:var(--ok-line)}
.tag-blue{background:linear-gradient(135deg,rgba(91,81,221,.07),rgba(91,81,221,.03));color:var(--brand-dark);border-color:var(--brand-line)}
.tag-purple{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(139,92,246,.04));color:var(--purple);border-color:#ddd6fe}
.tag-duty{background:#f8fafc;color:var(--ink-3);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line-2);background:#fafbff}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lab{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp,select.inp,textarea.inp{
  width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;font-size:16px;transition:border-color .15s,box-shadow .15s;outline:none;
}
@media (min-width:768px){.inp,select.inp,textarea.inp{font-size:13.5px}}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,81,221,.1),0 0 0 5px rgba(91,81,221,.04)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.6}
select.inp{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:30px}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-4);pointer-events:none}
.search .inp{padding-left:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:#fff;box-shadow:var(--sh)}
.seg button{padding:0 14px;height:38px;font-size:13px;color:var(--ink-3);border-right:1px solid var(--line);font-weight:600;transition:all .16s ease}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(91,81,221,.28)}

/* ---------- 表格 ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th{text-align:left;font-weight:700;color:var(--ink-3);font-size:12px;padding:12px 14px;background:#fafbff;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1;letter-spacing:.2px;text-transform:uppercase;font-size:11.5px}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:#fafbff}
tbody tr:last-child td{border-bottom:none}
.td-acts{white-space:nowrap;text-align:right}
.row-danger{background:linear-gradient(135deg,rgba(239,68,68,.05),rgba(239,68,68,.02)) !important}
.row-danger:hover{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.04)) !important}
.name-cell{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-soft),rgba(139,92,246,.1));color:var(--brand-dark);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 32px;border:2px solid rgba(91,81,221,.08);box-shadow:0 2px 6px rgba(91,81,221,.06)}
.avatar.f{background:linear-gradient(135deg,#fdf2f8,#fce7f3);color:#db2777;border-color:rgba(219,39,119,.1)}
.link-btn{color:var(--brand);font-weight:700;font-size:12.5px}
.link-btn:hover{text-decoration:underline}
.link-btn.danger{color:var(--danger)}

/* 移动端卡片列表 */
.mcards{display:none}
.mcard{padding:15px 18px;border-bottom:1px solid var(--line-2);transition:background .14s ease}
.mcard:last-child{border-bottom:none}
.mcard-hd{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mcard-t{font-weight:700;font-size:14.8px;flex:1;min-width:0;word-break:break-word;color:var(--ink)}
.mcard-meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.mcard-acts{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{
  background:linear-gradient(145deg,#fff,#fafbff);border:1px solid rgba(226,232,240,.7);
  border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-kpi);
  position:relative;overflow:hidden;transition:all .25s cubic-bezier(.22,.7,.3,1);
}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(15,23,42,.08)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad);opacity:.9;border-radius:0 3px 3px 0}
.kpi.l::before{background:linear-gradient(180deg,#10b981,#059669)}
.kpi.w::before{background:linear-gradient(180deg,#f59e0b,#d97706)}
.kpi.d::before{background:linear-gradient(180deg,#ef4444,#dc2626)}
.kpi-l{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:600;letter-spacing:.2px}
.kpi-v{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1;background:linear-gradient(135deg,var(--ink),var(--ink-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.kpi-s{font-size:11.5px;color:var(--ink-4);margin-top:5px;font-weight:500}
.kpi.danger .kpi-v{background:linear-gradient(135deg,var(--danger),#be123c);-webkit-background-clip:text;background-clip:text}
.kpi.warn .kpi-v{background:linear-gradient(135deg,var(--warn),#b45309);-webkit-background-clip:text;background-clip:text}
.kpi.ok .kpi-v{background:linear-gradient(135deg,var(--ok),#047857);-webkit-background-clip:text;background-clip:text}
.kpi.brand .kpi-v{background:linear-gradient(135deg,var(--brand),var(--purple));-webkit-background-clip:text;background-clip:text}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:flex;align-items:center;justify-content:center;
  padding:16px;backdrop-filter:blur(4px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;box-shadow:var(--sh-lg);width:100%;max-width:620px;max-height:92vh;
  display:flex;flex-direction:column;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.narrow{max-width:420px}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;gap:10px;padding:17px 22px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fff,#fafbff)}
.modal-hd h3{margin:0;font-size:17.5px;font-weight:800;flex:1;letter-spacing:.2px}
.modal-bd{padding:22px;overflow-y:auto;flex:1}
.modal-ft{display:flex;gap:9px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap;background:#fafbff;border-radius:0 0 20px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.span2{grid-column:1/-1}
.form-row{margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 0}
.chk input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;flex:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;font-weight:600;
  background:#fff;color:var(--ink-3);transition:all .16s ease;min-height:34px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(91,81,221,.28)}
.hint{font-size:12px;color:var(--ink-4);margin-top:5px;line-height:1.6}

/* ---------- Toast ---------- */
#toast-root{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;
  align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.toast{
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 28px rgba(15,23,42,.2),0 0 0 1px rgba(255,255,255,.08) inset;
  display:flex;align-items:center;gap:8px;animation:tin .25s cubic-bezier(.22,.7,.3,1);max-width:100%;backdrop-filter:blur(8px)}
.toast.ok{background:linear-gradient(135deg,#10b981,#059669)} .toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)} .toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- 提示条 ---------- */
.banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;border:1px solid;font-weight:500}
.banner-warn{background:linear-gradient(135deg,rgba(245,158,11,.06),rgba(245,158,11,.03));border-color:var(--warn-line);color:#92400e}
.banner-info{background:linear-gradient(135deg,rgba(91,81,221,.05),rgba(139,92,246,.03));border-color:var(--brand-line);color:#3730a3}
.banner .sp{flex:1}

/* ---------- SVG 图表 ---------- */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.3px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
@keyframes drawBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-val{transform-origin:left;animation:drawBar .8s cubic-bezier(.22,.7,.3,1) both}
@keyframes donutIn{from{transform:scale(.92) rotate(-6deg);opacity:0}to{opacity:1;transform:none}}
.donut-anim{animation:donutIn .7s cubic-bezier(.22,.7,.3,1) both;transform-origin:center}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2.5px;background:linear-gradient(180deg,var(--brand),var(--purple));border-radius:3px}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:3.5px solid var(--brand);transition:all .2s ease;box-shadow:0 0 0 4px rgba(91,81,221,.08)}
.tl-d{font-size:12px;color:var(--ink-4);font-weight:700;letter-spacing:.3px}
.tl-c{font-size:13.5px;margin-top:4px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}

/* ---------- 左侧抽屉遮罩（移动端）---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:65;opacity:0;pointer-events:none;transition:opacity .28s ease;backdrop-filter:blur(3px)}

/* ---------- 底部 Tab（移动端）---------- */
.tabbar{display:none}

/* ---------- 移动端适配 ---------- */
@media (max-width:900px){
  :root{--nav-w:0px}
  .sidenav{position:fixed;top:0;left:0;bottom:0;z-index:66;width:276px;flex:none;
    background:#fff;box-shadow:0 8px 40px rgba(15,23,42,.18);transform:translateX(-104%);transition:transform .3s cubic-bezier(.22,.7,.3,1);height:100%;border-right:none}
  .sidenav.open{transform:none}
  .main{padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
  .topbar{padding:0 14px;gap:8px;height:56px}
  .brand-sub,.who,.mo-hide{display:none}
  .brand{font-size:15.5px}
  .tw{display:none}
  .mcards{display:block}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px 16px}
  .kpi-v{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .today-stats{width:100%;margin-left:0}
  .todo-row{flex-wrap:wrap}
  .todo-acts{width:100%;padding-left:16px;margin-top:8px}
  .btn{min-height:44px}
  .btn-sm{min-height:38px}
  .modal{max-height:94vh;border-radius:18px}
  .modal-ft{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
    border-top:1px solid rgba(226,232,240,.7);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(15,23,42,.06);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:54px;font-size:11px;color:var(--ink-4);font-weight:600;position:relative;border-radius:12px;transition:all .18s ease}
  .tab.on{color:var(--brand);font-weight:800;background:linear-gradient(135deg,rgba(91,81,221,.08),rgba(139,92,246,.06))}
  .tab-dot{position:absolute;top:5px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(225,29,72,.3)}
}
@media (max-width:400px){ .kpis{grid-template-columns:1fr} }

/* ---------- 打印 ---------- */
@media print{
  .topbar,.sidenav,.tabbar,.toolbar,.todo-acts,.td-acts,.btn,.scrim{display:none !important}
  .main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

/* ============================================================================

'use strict';

/* 重点关注类型 */

/* 关注等级 → 建议谈话周期（天） */

];
const LEVEL_MAP = Object.fromEntries(LEVELS.map(l => [l.k, l]));

/* 心理危机预警库（参照本院《心理危机预警库名单》） */

/* 校外住宿 / 走读 */
const STU_TYPES = ['本科生','研究生'];
const APPROVALS = ['审批通过','审批中','待审批','未通过'];

/* 评优榜样 / 先进个人 申请类型 */
const HONOR_TYPES = [
  { v:'先锋', n:'低空先锋' }, { v:'德育', n:'德育之星' }, { v:'智育', n:'智育之星' },
  { v:'体育', n:'体育之星' }, { v:'美育', n:'美育之星' }, { v:'劳育', n:'劳育之星' },

const $  = (s, r) => (r || document).querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>

const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');

function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function shiftDay(dateStr, n) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function daysFromToday(dateStr) {
  if (!dateStr) return null;
  const a = new Date(dateStr + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function cnDate(dateStr) {
  if (!dateStr) return '';
  const p = dateStr.split('-');
  return p.length === 3 ? `${+p[1]}月${+p[2]}日` : dateStr;
}
function dueText(dateStr) {
  const d = daysFromToday(dateStr);
  if (d === null) return { t:'未设截止', cls:'tag' };
  if (d < 0)  return { t:`逾期 ${-d} 天`, cls:'tag-red' };
  if (d === 0) return { t:'今天截止', cls:'tag-red' };
  if (d === 1) return { t:'明天截止', cls:'tag-amber' };
  if (d <= 3) return { t:`还有 ${d} 天`, cls:'tag-amber' };
  return { t:`${cnDate(dateStr)} 截止`, cls:'tag' };
}
function monthOf(dateStr) { return (dateStr || '').slice(0, 7); }
function thisMonth() { return today().slice(0, 7); }
function termRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  if (m >= 3 && m <= 8) return { name:`${y} 春季学期`, from:`${y}-03-01`, to:`${y}-08-31` };
  if (m >= 9) return { name:`${y}-${y+1} 秋季学期`, from:`${y}-09-01`, to:`${y+1}-02-28` };
  return { name:`${y-1}-${y} 秋季学期`, from:`${y-1}-09-01`, to:`${y}-02-28` };
}
function download(filename, content, mime) {
  const blob = new Blob([content], { type: (mime || 'application/octet-stream') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function toCSV(rows) {
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function pinyinInitial(name) { return (name || '?').trim().slice(0, 1); }

/* ===================== 3. 数据层 store ===================== */
const NS = 'cwb_v1_';
const store = {
  read(key, fallback) {
    try { const raw = localStorage.getItem(NS + key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { console.warn('[CWB] 读取失败', key, e); return fallback; }
  },
  write(key, val) {
    try { localStorage.setItem(NS + key, JSON.stringify(val)); hooks.emit('store:write', { key, val }); return true; }
    catch (e) {
      ui.toast(e && e.name === 'QuotaExceededError'
        ? '本地存储空间已满，请先导出备份并清理旧数据' : '保存失败：' + e.message, 'err');
      return false;
    }
  },
  remove(key) { localStorage.removeItem(NS + key); },
  keys() { return Object.keys(localStorage).filter(k => k.startsWith(NS)).map(k => k.slice(NS.length)); },
  bytes() {
    let n = 0;
    this.keys().forEach(k => { n += (localStorage.getItem(NS + k) || '').length * 2; });
    return n;
  }
};

const DB = {

function save(part) {

  if (!part || part === 'tasks')    store.write('tasks', DB.tasks);
  if (!part || part === 'talks')    store.write('talks', DB.talks);
  if (!part || part === 'stay')     store.write('stay', DB.stay);
  if (!part || part === 'leave')    store.write('leave', DB.leave);
  if (!part || part === 'honor')    store.write('honor', DB.honor);

const ui = {

    $('#toast-root').appendChild(el);
    setTimeout(() => { el.style.transition = '.25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, ms || 2400);
  },
  modal(opts) {
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = `
      <div class="modal ${opts.size || ''}" role="dialog" aria-modal="true">
        <div class="modal-hd">
          <h3>${esc(opts.title || '')}</h3>
          <button class="btn btn-ghost btn-icon" data-close aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-bd">${opts.body || ''}</div>
        ${opts.footer === null ? '' : `<div class="modal-ft">${opts.footer || '<button class="btn" data-close>关闭</button>'}</div>`}
      </div>`;
    $('#modal-root').appendChild(mask);
    const close = () => { mask.remove(); document.body.style.overflow = ''; };
    document.body.style.overflow = 'hidden';
    mask.addEventListener('click', e => {
      if (e.target === mask && !opts.sticky) close();
      if (e.target.closest('[data-close]')) close();
    });
    const onKey = e => { if (e.key === 'Escape' && !opts.sticky) { close(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
    if (opts.onOpen) opts.onOpen(mask, close);
    return close;
  },
  confirm(title, msg, onYes, danger) {
    ui.modal({
      title, size:'narrow', sticky:true,
      body:`<div style="font-size:14px;line-height:1.75;color:var(--ink-2)">${msg}</div>`,
      footer:`<button class="btn" data-close>取消</button>
              <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>确定</button>`,
      onOpen(mask, mClose) {
        $('[data-yes]', mask).onclick = () => { mClose(); onYes && onYes(); };
      }
    });
  },
  form(opts) {
    const fields = opts.fields, data = Object.assign({}, opts.data || {});
    const html = `<div class="grid2">` + fields.map(f => {
      const v = data[f.key] == null ? (f.def == null ? '' : f.def) : data[f.key];
      const span = (f.span === 2 || f.type === 'textarea' || f.type === 'chips') ? ' span2' : '';
      let ctl = '';
      if (f.type === 'select') {
        ctl = `<select class="inp" data-k="${f.key}">` +
          (f.options || []).map(o => {
            const val = typeof o === 'string' ? o : o.v;
            const lab = typeof o === 'string' ? o : o.n;
            return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`;
          }).join('') + `</select>`;
      } else if (f.type === 'textarea') {
        ctl = `<textarea class="inp" data-k="${f.key}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
      } else if (f.type === 'chips') {
        const arr = Array.isArray(v) ? v : [];
        ctl = `<div class="chips" data-chips="${f.key}">` + (f.options || []).map(o =>
          `<button type="button" class="chip${arr.includes(o.v) ? ' on' : ''}" data-v="${esc(o.v)}">${esc(o.n)}</button>`
        ).join('') + `</div>`;
      } else if (f.type === 'checkbox') {
        return `<div class="form-row${span}"><label class="chk">
          <input type="checkbox" data-k="${f.key}"${v ? ' checked' : ''}><span>${esc(f.label)}</span></label>
          ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
      } else {
        ctl = `<input class="inp" type="${f.type || 'text'}" data-k="${f.key}" value="${esc(v)}"
          placeholder="${esc(f.ph || '')}"${f.list ? ` list="${f.list}"` : ''}${f.type === 'number' ? ' inputmode="numeric"' : ''}>`;
      }
      return `<div class="form-row${span}">
        <label class="lab" style="display:block;margin-bottom:5px">${esc(f.label)}${f.required ? ' <span style="color:var(--danger)">*</span>' : ''}</label>
        ${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
    }).join('') + `</div>` + (opts.extra || '');

    const close = ui.modal({
      title: opts.title, size: opts.size, sticky: true,
      body: html,
      footer: `${opts.extraBtn || ''}<button class="btn" data-close>取消</button>
               <button class="btn btn-primary" data-ok>${esc(opts.okText || '保存')}</button>`,
      onOpen(mask, mClose) {
        $$('[data-chips]', mask).forEach(box => {
          box.addEventListener('click', e => {
            const b = e.target.closest('.chip'); if (!b) return;
            b.classList.toggle('on');
          });
        });
        const first = $('.inp', mask); if (first && window.innerWidth > 900) setTimeout(() => first.focus(), 60);
        $('[data-ok]', mask).onclick = () => {
          const out = {};
          $$('[data-k]', mask).forEach(el => {
            out[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value.trim();
          });
          $$('[data-chips]', mask).forEach(box => {
            out[box.dataset.chips] = $$('.chip.on', box).map(c => c.dataset.v);
          });
          const miss = fields.filter(f => f.required && !String(out[f.key] || '').trim());
          if (miss.length) { ui.toast('请填写：' + miss.map(m => m.label).join('、'), 'warn'); return; }
          if (opts.onSave(out) !== false) mClose();
        };
        if (opts.onOpen) opts.onOpen(mask, mClose);
      }
    });
    return close;
  }
};

/* ===================== 6. 事件钩子 ===================== */
const hooks = {
  _m: {},
  on(name, fn) { (this._m[name] = this._m[name] || []).push(fn); return this; },
  off(name, fn) { this._m[name] = (this._m[name] || []).filter(f => f !== fn); return this; },
  emit(name, payload) {
    (this._m[name] || []).forEach(fn => { try { fn(payload); } catch (e) { console.error('[CWB hook]', name, e); } });
    return this;
  }
};

/* ===================== 7. 平台联动桥 bridge ===================== */
const bridge = {
  PACKAGE_VERSION: 2,
  buildPackage(scope) {
    scope = scope || {};
    const inRange = d => (!scope.from || d >= scope.from) && (!scope.to || d <= scope.to);
    return {
      package: 'counselor-desk',
      package_version: this.PACKAGE_VERSION,
      app_version: APP_VERSION,
      exported_at: new Date().toISOString(),
      counselor: {
        name: DB.settings.counselor_name || '',
        college_name: DB.settings.college_name || '',
        org_code: DB.settings.org_code || '',
      },
      scope,
      students: scope.students === false ? [] : DB.students,
      tasks: (scope.tasks === false ? [] : DB.tasks).filter(t => !scope.from || inRange(t.due || t.created_at.slice(0, 10))),
      talks: (scope.talks === false ? [] : DB.talks).filter(t => inRange(t.date)),
      stay: scope.stay === false ? [] : DB.stay,
      leave: scope.leave === false ? [] : DB.leave,
      honor: scope.honor === false ? [] : DB.honor,
      custom: DB.custom,
      stats: this.stats(scope),
    };
  },
  stats(scope) {
    scope = scope || {};
    const inRange = d => (!scope.from || d >= scope.from) && (!scope.to || d <= scope.to);
    const byDuty = {};
    DUTIES.forEach(d => { byDuty[d.k] = { duty:d.k, duty_name:d.n, tasks:0, tasks_done:0, talks:0 }; });
    DB.tasks.forEach(t => {
      const d = t.due || (t.created_at || '').slice(0, 10);
      if (!inRange(d)) return;
      const b = byDuty[t.duty]; if (!b) return;
      b.tasks++; if (t.status === 'done') b.tasks_done++;
    });
    DB.talks.forEach(t => { if (inRange(t.date) && byDuty[t.duty]) byDuty[t.duty].talks++; });
    return {
      student_total: DB.students.length,
      focus_total: DB.students.filter(s => s.focus_level).length,
      crisis_total: DB.students.filter(s => s.crisis_level && !s.crisis_relieved).length,
      task_total: DB.tasks.length,
      task_done: DB.tasks.filter(t => t.status === 'done').length,
      talk_total: DB.talks.filter(t => inRange(t.date)).length,
      stay_total: DB.stay.length,
      leave_total: DB.leave.length,
      honor_total: DB.honor.length,
      by_duty: Object.values(byDuty),
    };
  },
  applyPackage(pkg, mode) {
    if (!pkg || typeof pkg !== 'object') throw new Error('文件格式无法识别');
    const isPkg = pkg.package === 'counselor-desk';
    const src = isPkg ? pkg : (pkg.data || pkg);
    const S = Array.isArray(src.students) ? src.students : [];
    const T = Array.isArray(src.tasks) ? src.tasks : [];
    const K = Array.isArray(src.talks) ? src.talks : [];
    const ST = Array.isArray(src.stay) ? src.stay : [];
    const LV = Array.isArray(src.leave) ? src.leave : [];
    const HO = Array.isArray(src.honor) ? src.honor : [];
    if (!S.length && !T.length && !K.length && !ST.length && !LV.length && !HO.length) throw new Error('文件中没有可导入的数据');

    if (mode === 'replace') {
      DB.students = S.map(normStudent); DB.tasks = T.map(normTask); DB.talks = K.map(normTalk);
      DB.stay = ST.map(normStay); DB.leave = LV.map(normLeave); DB.honor = HO.map(normHonor);
      if (src.custom) DB.custom = src.custom;
    } else {
      const sKey = x => x.student_number || x.id;
      const map = new Map(DB.students.map(x => [sKey(x), x]));
      S.forEach(x => { const k = sKey(x); map.has(k) ? Object.assign(map.get(k), x) : map.set(k, normStudent(x)); });
      DB.students = Array.from(map.values());
      const merge = (arr, incoming, norm) => {
        const m = new Map(arr.map(x => [x.id, x]));
        incoming.forEach(x => { const o = norm(x); m.has(o.id) ? Object.assign(m.get(o.id), o) : m.set(o.id, o); });
        return Array.from(m.values());
      };
      DB.tasks = merge(DB.tasks, T, normTask);
      DB.talks = merge(DB.talks, K, normTalk);
      DB.stay = merge(DB.stay, ST, normStay);
      DB.leave = merge(DB.leave, LV, normLeave);
      DB.honor = merge(DB.honor, HO, normHonor);
    }
    if (isPkg && src.counselor && !DB.settings.counselor_name) {
      DB.settings.counselor_name = src.counselor.name || '';
      DB.settings.college_name = src.counselor.college_name || '';
      DB.settings.org_code = src.counselor.org_code || '';
    }
    save();
    return { students:S.length, tasks:T.length, talks:K.length, stay:ST.length, leave:LV.length, honor:HO.length };
  },
  get baseUrl() { return (DB.settings.platform_url || '').replace(/\/$/, ''); },
  get enabled() { return !!this.baseUrl && !!DB.settings.platform_api_on; },
  async request(path, init) {
    if (!this.baseUrl) throw new Error('未配置平台地址');
    const res = await fetch(this.baseUrl + path, Object.assign({
      credentials:'include', headers:{ 'Content-Type':'application/json' }
    }, init || {}));
    if (!res.ok) throw new Error('平台返回 ' + res.status);
    return res.json();
  },
  async pullTasks() {
    const data = await this.request('/api/collection/assignments');
    const list = (data.items || data.assignments || []);
    let added = 0;
    list.forEach(a => {
      const ref = String(a.id || a.assignmentId || '');
      if (!ref || DB.tasks.some(t => t.platform_ref === ref)) return;
      DB.tasks.push(normTask({
        title: a.title || a.taskTitle || '平台任务',
        source: '平台下发', duty: 'daily', priority: 'P1',
        due: (a.dueAt || a.due_at || '').slice(0, 10),
        platform_ref: ref, note: a.description || '',
      }));
      added++;
    });
    if (added) save('tasks');
    return added;
  },
  async pushSummary(scope) {
    return this.request('/api/local-desk/summary', { method:'POST', body: JSON.stringify(this.buildPackage(scope)) });
  }
};

function normStay(x) {

  return {
    id: x.id || uid(),
    student_name: String(x.student_name || '').trim(),
    student_number: x.student_number || '',
    grade_major: x.grade_major || '',

    reason: x.reason || '',

function buildTodo() {
  const out = [];
  DB.tasks.forEach(t => {
    if (t.status === 'done') return;
    const d = daysFromToday(t.due);
    if (d === null || d > 3) return;
    out.push({
      kind:'task', ref:t.id, level: d < 0 ? 'd' : (d === 0 ? 'd' : 'w'), sort: d,
      title: t.title,
      meta: [
        d < 0 ? `<span class="tag tag-red">逾期 ${-d} 天</span>` : (d === 0 ? '<span class="tag tag-red">今天截止</span>' : `<span class="tag tag-amber">还有 ${d} 天</span>`),
        `<span class="tag tag-duty">${esc(DUTY_MAP[t.duty] ? DUTY_MAP[t.duty].s : '其他')}</span>`,
        `<span class="tag ${PRIO_MAP[t.priority] ? PRIO_MAP[t.priority].c : 'tag'}">${esc(PRIO_MAP[t.priority] ? PRIO_MAP[t.priority].n : '')}</span>`,
        t.classes ? `<span>${esc(t.classes)}</span>` : '',
        `<span>${esc(t.source)}</span>`,
      ].filter(Boolean).join(''),
      acts: `<button class="btn btn-sm btn-ok" data-act="task-done" data-id="${t.id}"><svg class="ic ic-sm"><use href="#i-check"/></svg>完成</button>
             <button class="btn btn-sm" data-act="task-defer" data-id="${t.id}">顺延一天</button>
             <button class="btn btn-sm" data-act="task-edit" data-id="${t.id}">详情</button>`
    });
  });
  DB.talks.forEach(t => {
    if (!t.need_follow || t.done_follow) return;
    const d = daysFromToday(t.follow_date);
    if (d === null || d > 2) return;
    out.push({
      kind:'talk', ref:t.id, level: d < 0 ? 'd' : 'w', sort: d - 0.1,
      title: `回访跟进：${t.student_name}`,
      meta: [
        d < 0 ? `<span class="tag tag-red">已逾期 ${-d} 天</span>` : (d === 0 ? '<span class="tag tag-red">今天回访</span>' : `<span class="tag tag-amber">还有 ${d} 天</span>`),
        `<span class="tag tag-duty">${esc(DUTY_MAP[t.duty] ? DUTY_MAP[t.duty].s : '')}</span>`,
        `<span>${cnDate(t.date)} 谈话 · ${esc(t.way)}</span>`,
        `<span class="tiny">${esc((t.action || t.summary || '').slice(0, 40))}</span>`,
      ].filter(Boolean).join(''),
      acts: `<button class="btn btn-sm btn-ok" data-act="talk-followed" data-id="${t.id}"><svg class="ic ic-sm"><use href="#i-check"/></svg>已回访</button>
             <button class="btn btn-sm btn-primary" data-act="talk-new-for" data-id="${t.id}">记一次新谈话</button>
             <button class="btn btn-sm" data-act="talk-view" data-id="${t.id}">详情</button>`
    });
  });
  DB.students.forEach(s => {
    if (s.crisis_level && !s.crisis_relieved) {
      out.push({
        kind:'crisis', ref:s.id, level:'d', sort:-5,
        title: `${s.full_name} · 心理危机预警（${s.crisis_level}）${s.crisis_relieved ? '已解除' : '未解除'}`,
        meta: [
          `<span class="tag tag-red">危机预警</span>`,
          `<span class="tag ${s.crisis_level === '校级' ? 'tag-red' : 'tag-amber'}">${esc(s.crisis_level)}</span>`,
          s.crisis_way ? `<span>${esc(s.crisis_way)}</span>` : '',
          `<span>${esc(s.class_name)}</span>`,
        ].filter(Boolean).join(''),
        acts: `<button class="btn btn-sm btn-primary" data-act="talk-new-student" data-id="${s.id}"><svg class="ic ic-sm"><use href="#i-talk"/></svg>记录谈话</button>
             <button class="btn btn-sm" data-act="student-view" data-id="${s.id}">学生档案</button>`
      });
    }
    const L = LEVEL_MAP[s.focus_level];
    if (!L || !L.days) return;
    const talks = DB.talks.filter(t => t.student_number === s.student_number || t.student_name === s.full_name);
    const last = talks.map(t => t.date).sort().pop();
    const over = last ? (daysFromToday(last) + L.days) : -1;
    if (over > 1) return;
    out.push({
      kind:'focus', ref:s.id, level: over < 0 ? 'd' : 'w', sort: over - 0.2,
      title: `${s.full_name} · ${L.n} 关注学生${last ? '已 ' + (-daysFromToday(last)) + ' 天未谈话' : '尚无谈话记录'}`,
      meta: [
        over < 0 ? `<span class="tag tag-red">超出周期 ${-over} 天</span>` : `<span class="tag tag-amber">周期将至</span>`,
        `<span class="tag ${L.c}">${esc(L.n)}</span>`,
        (s.focus || []).map(f => FOCUS_MAP[f] ? `<span class="tag ${FOCUS_MAP[f].c}">${esc(FOCUS_MAP[f].n)}</span>` : '').join(''),
        `<span>${esc(s.class_name)}</span>`,
        `<span class="tiny">${esc(L.desc)}</span>`,
      ].filter(Boolean).join(''),
      acts: `<button class="btn btn-sm btn-primary" data-act="talk-new-student" data-id="${s.id}"><svg class="ic ic-sm"><use href="#i-talk"/></svg>记录谈话</button>
             <button class="btn btn-sm" data-act="student-view" data-id="${s.id}">学生档案</button>`
    });
  });
  return out.sort((a, b) => a.sort - b.sort);
}

/* ---------- 11.1 内联 SVG 图表 ---------- */
function hBarChart(items, opt) {
  opt = opt || {};
  const W = 680, rowH = 30, padL = opt.padL || 92, padR = 54, top = 6;
  const H = top * 2 + Math.max(1, items.length) * rowH;
  const max = Math.max(1, ...items.map(i => i.value));
  const bw = W - padL - padR;
  let g = '';
  items.forEach((it, i) => {
    const y = top + i * rowH, len = Math.max(it.value > 0 ? 3 : 0, (it.value / max) * bw);
    g += `<text x="${padL - 8}" y="${y + 19}" text-anchor="end" font-size="12" fill="#64748b">${esc(it.label)}</text>
      <rect x="${padL}" y="${y + 7}" width="${bw}" height="15" rx="4" fill="#eef2ff"/>
      <rect class="bar-val" x="${padL}" y="${y + 7}" width="${len.toFixed(1)}" height="15" rx="4" fill="${it.color || '#4f46e5'}"><title>${esc(it.label)}：${it.value}</title></rect>
      <text x="${padL + len + 8}" y="${y + 19}" font-size="12" font-weight="700" fill="${it.value ? '#0f172a' : '#cbd5e1'}">${it.value}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="分类统计柱状图">${g}</svg></div>`;
}
function donutChart(items, centerTop, centerSub) {
  const total = items.reduce((a, b) => a + b.value, 0);
  const R = 54, C = 2 * Math.PI * R, cx = 70, cy = 70;
  let off = 0, ring = '';
  if (total > 0) {
    items.forEach(it => {
      if (!it.value) return;
      const len = (it.value / total) * C;
      ring += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${it.color}" stroke-width="20"
        stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"><title>${esc(it.label)}：${it.value}</title></circle>`;
      off += len;
    });
  } else {
    ring = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#eef2ff" stroke-width="20"/>`;
  }
  return `<div class="donut-anim" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="占比环形图">
      ${ring}
      <text x="70" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">${esc(centerTop)}</text>
      <text x="70" y="86" text-anchor="middle" font-size="11" fill="#94a3b8">${esc(centerSub || '')}</text>
    </svg>
    <div class="legend" style="flex-direction:column;gap:7px;margin:0">
      ${items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.label)} <b style="color:var(--ink)">${i.value}</b></span>`).join('')}
    </div></div>`;
}

function dutyBars(range) {
  const st = bridge.stats({ from: range.from, to: range.to });
  const items = st.by_duty.map(b => {
    const d = DUTY_MAP[b.duty];
    return { label: d.s, value: b.tasks + b.talks, color: d.c };
  });
  if (!items.some(i => i.value)) return emptyBox('本学期暂无记录，去任务台或谈话记录里添几条试试。');
  return hBarChart(items) + `<div class="legend"><span>统计口径：任务条数 + 谈话次数，按截止日期 / 谈话日期归入区间</span></div>`;
}

/* ---------- 11.4 工作任务 ---------- */
function filterTasks() {
  const f = app.filters.tasks;
  return DB.tasks.filter(t => {
    if (f.status === 'open' && t.status === 'done') return false;
    if (f.status === 'done' && t.status !== 'done') return false;
    if (f.duty && t.duty !== f.duty) return false;
    if (f.q) {
      const s = (t.title + t.note + t.classes + t.source).toLowerCase();
      if (!s.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => {
    if ((a.status === 'done') !== (b.status === 'done')) return a.status === 'done' ? 1 : -1;
    const ad = a.due || '9999', bd = b.due || '9999';
    return ad === bd ? (a.priority > b.priority ? 1 : -1) : (ad < bd ? -1 : 1);
  });
}

/* ---------- 11.5 学生台账 ---------- */
function classList() {
  return Array.from(new Set(DB.students.map(s => s.class_name).filter(Boolean))).sort();
}
function filterStudents() {
  const f = app.filters.students;
  return DB.students.filter(s => {
    if (f.cls && s.class_name !== f.cls) return false;
    if (f.focus === '__any' && !s.focus_level) return false;
    if (f.focus === '__crisis' && !(s.crisis_level && !s.crisis_relieved)) return false;
    if (f.focus && f.focus !== '__any' && f.focus !== '__crisis' && !(s.focus || []).includes(f.focus)) return false;
    if (f.q) {
      const t = (s.full_name + s.student_number + s.class_name + s.dorm + s.note + s.phone + s.politics).toLowerCase();
      if (!t.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => {
    const la = a.focus_level || 'Z', lb = b.focus_level || 'Z';
    if (la !== lb) return la < lb ? -1 : 1;
    return (a.student_number || '') < (b.student_number || '') ? -1 : 1;
  });
}
function lastTalkOf(s) {

function viewReport() {

      <button class="btn btn-sm" data-act="print">打印 / 存 PDF</button>
    </div>

      <textarea class="inp" id="sum-text" rows="16" style="font-size:13.5px;line-height:1.85">${esc(buildSummary(R))}</textarea>

function buildSummary(R) {
  const st = bridge.stats({ from:R.from, to:R.to });
  const talks = DB.talks.filter(t => t.date >= R.from && t.date <= R.to);
  const tasks = DB.tasks.filter(t => { const d = t.due || (t.created_at || '').slice(0, 10); return d >= R.from && d <= R.to; });
  const who = DB.settings.counselor_name || '本人';
  const L = [];
  L.push(`${R.name}辅导员工作小结`);
  L.push('');
  L.push(`辅导员：${who}${DB.settings.college_name ? '（' + DB.settings.college_name + '）' : ''}`);
  L.push(`统计区间：${R.from} 至 ${R.to}`);
  L.push(`带班学生：${st.student_total} 人，其中纳入重点关注 ${st.focus_total} 人，心理危机预警未解除 ${st.crisis_total} 人。`);
  L.push('');
  L.push('一、工作总量');
  L.push(`本区间共承接和推进各类工作任务 ${st.task_total} 项，已完成 ${st.task_done} 项；开展谈心谈话 ${talks.length} 人次，覆盖学生 ${new Set(talks.map(t => t.student_name)).size} 名；校外住宿（走读）${st.stay_total} 人、假期去向跟踪 ${st.leave_total} 人、评优榜样申报 ${st.honor_total} 人。`);
  L.push('');
  L.push('二、按九项工作职责开展情况');
  st.by_duty.forEach((b, i) => {
    if (!b.tasks && !b.talks) return;
    const items = tasks.filter(t => t.duty === b.duty).slice(0, 3).map(t => t.title);
    L.push(`${i + 1}. ${b.duty_name}：任务 ${b.tasks} 项（完成 ${b.tasks_done} 项），谈话 ${b.talks} 人次。${items.length ? '主要工作包括' + items.join('、') + '等。' : ''}`);
  });
  L.push('');
  L.push('三、重点学生关注情况');
  const foc = DB.students.filter(s => s.focus_level);
  if (foc.length) {
    LEVELS.filter(l => l.k).forEach(l => {
      const g = foc.filter(s => s.focus_level === l.k);
      if (g.length) L.push(`${l.n}：${g.length} 人（${g.map(s => s.full_name).join('、')}），${l.desc}。`);
    });
    const types = {};
    foc.forEach(s => (s.focus || []).forEach(f => { types[f] = (types[f] || 0) + 1; }));
    const td = Object.keys(types).map(k => `${FOCUS_MAP[k] ? FOCUS_MAP[k].n : k} ${types[k]} 人`).join('，');
    if (td) L.push(`关注类型分布：${td}。`);
  } else L.push('本区间无纳入重点关注的学生。');
  const crisis = DB.students.filter(s => s.crisis_level && !s.crisis_relieved);
  if (crisis.length) L.push(`心理危机预警（未解除）：${crisis.map(s => `${s.full_name}（${s.crisis_level}，${s.crisis_way || '来源未填'}）`).join('、')}。`);
  L.push('');
  L.push('四、下一步计划');
  const undone = DB.tasks.filter(t => t.status !== 'done').slice(0, 5);
  L.push(undone.length
    ? undone.map((t, i) => `${i + 1}）${t.title}${t.due ? `（${t.due} 前完成）` : ''}`).join('\n')
    : '按学院统一部署推进各项工作。');
  return L.join('\n');
}

  const fields = Object.keys(schema.student).map(k => {
    const f = schema.student[k];
    return `<tr><td><code style="font-size:12.5px;color:var(--brand-dark)">${k}</code></td><td>${esc(f.label)}</td>
      <td>${f.platform ? '<span class="tag tag-green">与平台同名</span>' : '<span class="tag">本地扩展</span>'}</td></tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-hd"><h2><svg class="ic" style="color:var(--brand)"><use href="#i-link"/></svg>与「辅导员工作平台」联动</h2></div>
    <div class="card-bd">
      <div class="banner banner-info" style="margin-bottom:16px"><svg class="ic ic-sm"><use href="#i-inbox"/></svg>
        <span class="sp">本工作台是<b>纯本地</b>的。当前阶段通过<b>文件交换</b>与服务端平台协作：
        平台导出名单 → 本地导入干活 → 本地导出交换包 → 上传平台汇总。API 直连通道已预留，平台开放接口后即可打通。</span></div>
      <div class="grid2">
        <div class="form-row"><label class="lab" style="display:block;margin-bottom:5px">平台地址（可留空）</label>
          <input class="inp" data-set="platform_url" value="${esc(s.platform_url || '')}" placeholder="https://your-platform.example.com">
          <div class="hint">仅用于将来 API 直连；留空不影响任何本地功能。</div></div>
        <div class="form-row"><label class="lab" style="display:block;margin-bottom:5px">组织代码</label>
          <input class="inp" data-set="org_code" value="${esc(s.org_code || '')}" placeholder="如 demo">
          <div class="hint">与平台端组织代码保持一致，导出包会带上此标识。</div></div>
      </div>
      <label class="chk"><input type="checkbox" data-set-chk="platform_api_on"${s.platform_api_on ? ' checked' : ''}>
        <span>启用 API 直连（平台接口就绪后再打开）</span></label>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2>数据交换</h2></div>
    <div class="card-bd" style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn btn-primary" data-act="pkg-export"><svg class="ic ic-sm"><use href="#i-down"/></svg>导出交换包（上报用）</button>
      <button class="btn" data-act="export-json"><svg class="ic ic-sm"><use href="#i-down"/></svg>导出完整备份</button>
      <button class="btn" data-act="import-json"><svg class="ic ic-sm"><use href="#i-up"/></svg>导入备份 / 交换包</button>
      <button class="btn" data-act="student-template">下载学生名单模板</button>
      <button class="btn" data-act="pkg-pull"${bridge.enabled ? '' : ' disabled style="opacity:.5;cursor:not-allowed"'}>
        <svg class="ic ic-sm"><use href="#i-arrow"/></svg>从平台拉取任务${bridge.enabled ? '' : '（未启用）'}</button>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2>字段对照表</h2><span class="sp"></span><span class="tiny">导入导出无需改字段名</span></div>
    <div class="tw"><table><thead><tr><th>字段名</th><th>含义</th><th>与平台关系</th></tr></thead><tbody>${fields}</tbody></table></div>
  </div>

  <div class="card">
    <div class="card-hd"><h2><svg class="ic" style="color:var(--brand)"><use href="#i-book"/></svg>自己动手改造它</h2></div>
    <div class="card-bd">
      <p class="muted" style="margin-top:0">这个工作台是<b>单个 HTML 文件</b>，用记事本就能改。想加模块时，把下面这段话连同 index.html 一起交给 AI 就行：</p>
      <textarea class="inp" rows="4" readonly style="font-size:12.5px;background:#fafbfc">帮我在这个辅导员工作台里增加一个「XX」模块：字段有 A、B、C。请沿用文件里已有的 CWB.store 存储、ui.form 表单和卡片样式，只新增代码，不要改动原有模块。</textarea>
      <div style="margin-top:14px">
        <div class="lab" style="margin-bottom:6px">已开放的扩展接口（在浏览器控制台可直接调用）</div>
        <div class="tw"><table><tbody>
          <tr><td><code>CWB.store</code></td><td class="muted">读写本地数据：<code>CWB.store.read(key, 默认值)</code> / <code>write(key, 值)</code></td></tr>
          <tr><td><code>CWB.db</code></td><td class="muted">当前全部数据：<code>students / tasks / talks / stay / leave / honor / settings / custom</code></td></tr>
          <tr><td><code>CWB.ui.form()</code></td><td class="muted">一行代码生成带校验的弹窗表单</td></tr>
          <tr><td><code>CWB.ui.toast()</code></td><td class="muted">轻提示</td></tr>
          <tr><td><code>CWB.modules.register()</code></td><td class="muted">注册自定义模块，自动出现在左侧导航</td></tr>
          <tr><td><code>CWB.hooks.on()</code></td><td class="muted">监听 <code>store:write</code> / <code>view:render</code> 等事件</td></tr>
          <tr><td><code>CWB.bridge</code></td><td class="muted">交换包生成、导入、平台 API 通道</td></tr>
        </tbody></table></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2 style="color:var(--danger)">危险操作</h2></div>
    <div class="card-bd" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-danger" data-act="clear-demo">清空示例数据</button>
      <button class="btn btn-danger" data-act="clear-all">清空全部数据</button>
      <span class="tiny">当前本机占用约 ${(store.bytes() / 1024).toFixed(1)} KB · 共 ${dataCount()} 条记录</span>
    </div>
  </div>`;
}

function taskForm(t) {
  const isNew = !t;
  ui.form({
    title: isNew ? '新建工作任务' : '编辑任务', data: t || { due: today(), status:'todo', priority:'P1', duty:'daily', source:'学院安排' },
    fields: [
      { key:'title', label:'任务名称', required:true, span:2, ph:'例如：组织本学期国家助学金初审' },
      { key:'duty', label:'职责分类（43 号令）', type:'select', options: DUTIES.map(d => ({ v:d.k, n:d.n })) },
      { key:'source', label:'任务来源', type:'select', options: SOURCES },
      { key:'due', label:'截止日期', type:'date' },
      { key:'priority', label:'优先级', type:'select', options: PRIOS.map(p => ({ v:p.k, n:p.n })) },
      { key:'classes', label:'涉及班级', ph:'留空表示全体', list:'dl-class' },
      { key:'status', label:'状态', type:'select', options:[{ v:'todo', n:'待办' }, { v:'doing', n:'进行中' }, { v:'done', n:'已完成' }] },
      { key:'note', label:'备注 / 完成情况', type:'textarea', rows:3 },
      { key:'platform_ref', label:'平台任务号（选填）', hint:'与服务端平台任务关联时填写，便于回传对账' },
    ],
    extra: `<datalist id="dl-class">${classList().map(c => `<option value="${esc(c)}">`).join('')}</datalist>`,
    onSave(v) {
      if (isNew) { DB.tasks.push(normTask(v)); ui.toast('任务已创建', 'ok'); }
      else {
        if (v.status === 'done' && t.status !== 'done') v.done_at = today();
        Object.assign(t, normTask(Object.assign({}, t, v))); ui.toast('已保存', 'ok');
      }
      save('tasks'); render();
    }
  });
}

function openStudent(s) {
  const talks = DB.talks.filter(t => t.student_number === s.student_number || t.student_name === s.full_name)
    .sort((a, b) => a.date < b.date ? 1 : -1);
  const L = LEVEL_MAP[s.focus_level];
  ui.modal({
    title: `学生档案 · ${s.full_name}`, size:'wide',
    body: `
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
        ${avatarBig(s)}
        <div style="flex:1;min-width:180px">
          <div style="font-size:17px;font-weight:700">${esc(s.full_name)}
            ${L && L.k ? `<span class="tag ${L.c}" style="margin-left:6px">${esc(L.n)}</span>` : ''}
            ${crisisTag(s)}</div>
          <div class="muted">${esc(s.student_number)} · ${esc(s.class_name)} · ${esc(s.major_name)}</div>
        </div>
        <button class="btn btn-sm" data-edit-stu>编辑档案</button>
        <button class="btn btn-sm btn-primary" data-new-talk>记录谈话</button>
      </div>
      <div class="grid3" style="gap:9px;margin-bottom:14px">
        <div><div class="tiny">性别</div><div>${esc(s.gender || '—')}</div></div>
        <div><div class="tiny">联系电话</div><div>${esc(s.phone || '—')}</div></div>
        <div><div class="tiny">宿舍</div><div>${esc(s.dorm || '—')}</div></div>
        <div><div class="tiny">年级</div><div>${esc(s.grade || '—')}</div></div>
        <div><div class="tiny">学生当前状态</div><div>${esc(s.enrollment_status || '—')}</div></div>
        <div><div class="tiny">政治面貌</div><div>${esc(s.politics || '—')}</div></div>
      </div>
      ${(s.focus || []).length ? `<div style="margin-bottom:12px"><div class="tiny" style="margin-bottom:5px">关注类型</div>${focusTags(s)}</div>` : ''}

function studentTemplate() {

  const rows = [cols.map(c => schema.student[c].label + '(' + c + ')'),
    ['2024010101','张三','男','24机器人1班','机器人工程','2024级','示例学院', DB.settings.counselor_name || '某老师','13800000000','3号楼412']];
  download('学生名单导入模板.csv', toCSV(rows), 'text/csv');

}
function importStudentsCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { ui.toast('文件里没有数据行', 'err'); return; }
  const head = rows[0].map(h => {
    const raw = String(h).trim();
    const m = raw.match(/\(([a-z_]+)\)\s*$/i);
    if (m) return m[1];
    if (CSV_MAP[raw]) return CSV_MAP[raw];
    return raw.toLowerCase().replace(/\s/g, '_');
  });
  if (!head.includes('full_name') && !head.includes('student_number')) {
    ui.toast('未识别到「姓名」或「学号」列，请用模板格式', 'err', 3600); return;
  }
  let add = 0, upd = 0;
  rows.slice(1).forEach(r => {
    const o = {}; head.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
    if (!o.student_number && !o.full_name) return;
    if (o.focus) o.focus = String(o.focus).split(/[、,，\s]+/).filter(Boolean)
      .map(n => { const hit = FOCUS.find(f => f.n === n || f.k === n); return hit ? hit.k : null; }).filter(Boolean);
    const ex = DB.students.find(s => s.student_number && s.student_number === o.student_number);
    if (ex) { Object.keys(o).forEach(k => { if (o[k] !== '') ex[k] = o[k]; }); upd++; }
    else { DB.students.push(normStudent(o)); add++; }
  });
  save('students'); render();
  ui.toast(`导入完成：新增 ${add} 人，更新 ${upd} 人`, 'ok', 3200);
}

function render() {
  const fn = VIEWS[app.view] || (customModules[app.view] && customModules[app.view].render) || viewHome;
  const main = $('#main');
  main.innerHTML = fn();
  $$('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.view === app.view));
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === app.view));
  updateBadges();
  animateIn();

function animateIn() {
  const main = $('#main');
  const kids = $$('.card, .today, .banner', main);
  kids.forEach((el, i) => {
    el.classList.remove('anim-in');
    void el.offsetWidth;
    el.style.animationDelay = (i * 55) + 'ms';
    el.classList.add('anim-in');
  });
  $$('.kpi-v[data-num]', main).forEach(el => countUp(el, parseInt(el.dataset.num, 10) || 0));
}
function countUp(el, target) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = target; return; }
  const dur = 600, t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function go(view) {
  app.view = view; render();
  closeDrawer();
  try { window.scrollTo({ top:0, behavior:'smooth' }); } catch (e) {}
}
function updateBadges() {
  const todo = buildTodo();
  const overdue = todo.filter(t => t.level === 'd').length;
  const openTasks = DB.tasks.filter(t => t.status !== 'done' && daysFromToday(t.due) !== null && daysFromToday(t.due) <= 0).length;
  const pend = DB.talks.filter(t => {
    if (!t.need_follow || t.done_follow) return false;
    const d = daysFromToday(t.follow_date);
    return d !== null && d <= 0;
  }).length;
  const setB = (id, n) => { const el = $(id); if (!el) return; el.textContent = n; el.classList.toggle('hide', !n); };
  setB('#nb-tasks', openTasks); setB('#nb-talks', pend); setB('#tb-tasks', overdue);
  const sb = $('#nb-students'); if (sb) { sb.textContent = DB.students.length; sb.classList.toggle('hide', !DB.students.length); }
}

  if (btn && ACTS[btn.dataset.act]) { ACTS[btn.dataset.act](btn.dataset.id); }
});
document.addEventListener('input', e => {
  const f = e.target.closest('[data-filter]');
  if (f && f.tagName !== 'SELECT') {
    const [g, k] = f.dataset.filter.split('.');
    app.filters[g][k] = f.value;
    clearTimeout(app._t);
    app._t = setTimeout(() => {
      const pos = f.selectionStart; render();
      const again = $(`[data-filter="${f.dataset.filter}"]`);
      if (again && again.tagName === 'INPUT') { again.focus(); again.setSelectionRange(pos, pos); }
    }, 260);
  }
});
document.addEventListener('change', e => {
  const f = e.target.closest('[data-filter]');
  if (f && f.tagName === 'SELECT') { const [g, k] = f.dataset.filter.split('.'); app.filters[g][k] = f.value; render(); return; }
  const s = e.target.closest('[data-set]');
  if (s) { DB.settings[s.dataset.set] = s.value.trim(); save('settings'); ui.toast('已保存', 'ok', 1200); paintWho(); return; }
  const c = e.target.closest('[data-set-chk]');
  if (c) { DB.settings[c.dataset.setChk] = c.checked; save('settings'); ui.toast('已保存', 'ok', 1200); return; }
});
$('#btn-export').onclick = exportJSON;
$('#btn-import').onclick = () => $('#file-json').click();
$('#btn-settings').onclick = openSettings;
$('#btn-menu').onclick = openDrawer;
$('#scrim').onclick = closeDrawer;
$('#file-json').onchange = function () {
  const f = this.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { doImportJSON(r.result); this.value = ''; }; r.readAsText(f, 'utf-8');
};
$('#file-csv').onchange = function () {
  const f = this.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { importStudentsCSV(r.result); this.value = ''; }; r.readAsText(f, 'utf-8');
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if ($('#modal-root').children.length) return;
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey) {
    if (app.view === 'students') studentForm(null);
    else if (app.view === 'talks') talkForm(null);
    else if (app.view === 'stay') stayForm(null);
    else if (app.view === 'leave') leaveForm(null);
    else if (app.view === 'honor') honorForm(null);
    else taskForm(null);
  }
});

/* ---------- 15. 自定义模块注册（给二次开发用） ---------- */
const customModules = {};
const modules = {
  register(def) {
    if (!def || !def.key || typeof def.render !== 'function') throw new Error('模块需要 key 和 render()');
    customModules[def.key] = def;
    VIEWS[def.key] = def.render;
    const nav = $('#sidenav');
    const btn = document.createElement('button');
    btn.className = 'nav-item'; btn.dataset.view = def.key;
    btn.innerHTML = `<svg class="ic"><use href="#${def.icon || 'i-flag'}"/></svg>${esc(def.name || def.key)}`;
    nav.insertBefore(btn, $('.nav-foot', nav));
    hooks.emit('module:register', def);
    return def;
  },
  list() { return Object.keys(customModules); }
};

/* ---------- 16. 启动 ---------- */
function boot() {
  DB.settings = store.read('settings', null);
  if (!DB.settings) { seedDemo(); }
  else {
    DB.students = (store.read('students', []) || []).map(normStudent);
    DB.tasks = (store.read('tasks', []) || []).map(normTask);
    DB.talks = (store.read('talks', []) || []).map(normTalk);
    DB.stay = (store.read('stay', []) || []).map(normStay);
    DB.leave = (store.read('leave', []) || []).map(normLeave);
    DB.honor = (store.read('honor', []) || []).map(normHonor);
    DB.custom = store.read('custom', {}) || {};
  }
  paintWho();
  render();
  console.log('%c辅导员工作台 v' + APP_VERSION,
    'background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:3px 10px;border-radius:5px;font-weight:700');
  console.log('二次开发入口：window.CWB —— 试试 CWB.db.students 或 CWB.modules.register({...})');
}

/* ---------- 17. 对外暴露 ---------- */
window.CWB = {
  version: APP_VERSION,
  db: DB, store, schema, ui, hooks, bridge, modules,
  consts: { DUTIES, FOCUS, LEVELS, PRIOS, SOURCES, TALK_WAYS, CRISIS_LEVELS, CRISIS_WAYS, STU_TYPES, HONOR_TYPES, MORAL_LEVELS, POLITICS },
  utils: { esc, uid, today, shiftDay, daysFromToday, cnDate, toCSV, parseCSV, download },
  save, render, go,
  norm: { student:normStudent, task:normTask, talk:normTalk, stay:normStay, leave:normLeave, honor:normHonor },
};

boot();
})();
</script>
