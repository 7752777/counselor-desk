/* ==================== v3.8 学生大表导入（xls/xlsx/csv 三合一 + 列名同义词 + 容错 + 预览合并） ====================
   设计目标：
   1) 支持学校信息化门户 .xls / .xlsx 直传，缺省零依赖（CDN 动态加载 SheetJS）；
   2) 表头模糊匹配常见列名（学号/姓名/班级/专业/学院/手机/宿舍/性别/民族/政治面貌/出生日期/籍贯/家庭住址/家长/学制/邮箱/QQ）；
   3) 所有字段缺值回退到 ''，数字/日期缺值不抛错；
   4) 以「学号」为主键去重，重复时按列合并（新值补齐、空值不覆盖）；
   5) 导入前预览（识别 N 条、跳过 M 条无学号/姓名、合并 U 条）。 */

/* 列名同义词表：用户列名 → 内部字段 (顺序：先匹配更长更具体的) */
const STU_SYNONYMS = [
  // 学号
  { field:'student_number', keys:['学号','学籍号','学生编号','学号(工号)','student no','studentid','student number','stu_no','sno','sid','学号/工号','学号 '] },
  // 姓名
  { field:'full_name', keys:['姓名','学生姓名','名字','name','fullname','student name','学生姓名 '] },
  // 性别
  { field:'gender', keys:['性别','sex','gender','男/女'] },
  // 班级（行政班）
  { field:'class_name', keys:['班级','行政班','教学班','所在班级','class','class name','admission class'] },
  // 专业
  { field:'major_name', keys:['专业','专业名称','所学专业','major','major name','specialty'] },
  // 年级
  { field:'grade', keys:['年级','入学年级','当前年级','grade','grade year','admission year'] },
  // 学院
  { field:'college_name', keys:['学院','所在学院','院系','二级学院','college','school','department'] },
  // 辅导员
  { field:'counselor_name', keys:['辅导员','辅导员姓名','班主任','counselor','counselor name','advisor'] },
  // 学籍状态
  { field:'enrollment_status', keys:['学籍状态','在读状态','学习状态','status','enrollment status'] },
  // 政治面貌
  { field:'politics', keys:['政治面貌','面貌','political status','politics','political'] },
  // 手机
  { field:'phone', keys:['手机','手机号','联系电话','本人电话','本人手机号','phone','mobile','mobile phone','tel'] },
  // 宿舍
  { field:'dorm', keys:['宿舍','宿舍号','寝室','dorm','dormitory','room'] },
  // 出生日期
  { field:'birthday', keys:['出生日期','生日','出生年月','birthday','birth','date of birth','dob'] },
  // 籍贯
  { field:'hometown', keys:['籍贯','出生地','家庭所在地','hometown','native place'] },
  // 家庭住址
  { field:'home_addr', keys:['家庭住址','家庭地址','家庭详细地址','家庭通讯地址','address','home address'] },
  // 家长
  { field:'parent_name', keys:['家长姓名','家长','父母姓名','父亲/母亲','parent','guardian'] },
  // 家长电话
  { field:'parent_phone', keys:['家长电话','家长手机','父母电话','父亲电话','母亲电话','parent phone','guardian phone','父母手机'] },
  // 学制
  { field:'edu_years', keys:['学制','学制年限','学制(年)','years','duration'] },
  // 民族
  { field:'nation', keys:['民族','nation','nationality','ethnic'] },
  // 身份证
  { field:'id_card', keys:['身份证号','身份证','证件号','id card','idcard','id no'] },
  // 邮箱
  { field:'email', keys:['邮箱','电子邮箱','email','e-mail','mail'] },
  // QQ
  { field:'qq', keys:['qq','qq号','qq号码'] },
  // 备注
  { field:'note', keys:['备注','说明','remark','note','notes'] },
];

/* 将原始表头转为内部字段名（找不到则原样小写） */
function stuHeaderToField(raw) {
  const t = String(raw == null ? '' : raw).trim();
  if (!t) return '';
  // 形如 "姓名(full_name)" 优先取括号
  const m = t.match(/\(([a-z_]+)\)\s*$/i);
  if (m) return m[1].toLowerCase();
  // 同义词精确
  const key = t.toLowerCase();
  for (const g of STU_SYNONYMS) {
    for (const k of g.keys) {
      if (k.toLowerCase() === key) return g.field;
    }
  }
  // 同义词包含（兼容「学  号」、「学生 学号」等带空格的）
  for (const g of STU_SYNONYMS) {
    for (const k of g.keys) {
      const kk = k.toLowerCase();
      if (kk.length >= 2 && (key.includes(kk) || kk.includes(key))) return g.field;
    }
  }
  // 已有 CSV_MAP 兜底
  if (CSV_MAP[t]) return CSV_MAP[t];
  // 最后的兜底：原样小写+下划线
  return t.toLowerCase().replace(/\s+/g, '_');
}

/* 安全解析数字（学制等），失败回 0/'' */
function stuNum(v, fallback) {
  if (v == null || v === '') return fallback == null ? '' : fallback;
  const s = String(v).replace(/[^0-9.\-]/g, '');
  if (!s) return fallback == null ? '' : fallback;
  const n = parseFloat(s);
  return isFinite(n) ? n : (fallback == null ? '' : fallback);
}

/* SheetJS 动态加载（一次性，CDN 失败提示「请改用 CSV」） */
let _sheetJsLoading = null;
function loadSheetJS() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (_sheetJsLoading) return _sheetJsLoading;
  _sheetJsLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => { try { localStorage.setItem('cwb_v1_sheetjs_ok', '1'); } catch (e) {} resolve(); };
    s.onerror = () => { _sheetJsLoading = null; reject(new Error('SheetJS 加载失败')); };
    document.head.appendChild(s);
  });
  return _sheetJsLoading;
}

/* 把 SheetJS 的 array-of-arrays 转成 [{...row}, ...]，自动识别表头/无表头 */
function xlsxRowsToObjects(workbook, opts) {
  opts = opts || {};
  const sheetName = workbook.SheetNames[0];
  if (!sheetName) return [];
  const sheet = workbook.Sheets[sheetName];
  // header:1 → 二维数组（不做自动键）
  let aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
  if (!aoa || aoa.length === 0) return [];
  // 去尾部全空行
  while (aoa.length && aoa[aoa.length - 1].every(c => String(c == null ? '' : c).trim() === '')) aoa.pop();
  if (aoa.length === 0) return [];

  // 启发式判断首行是否是表头：首行所有单元格都不像纯数字、且能找到至少一个已知同义词
  const first = aoa[0].map(c => String(c == null ? '' : c).trim());
  const hits = first.map(stuHeaderToField).filter(f => f && STU_SYNONYMS.some(g => g.field === f));
  const hasHeader = hits.length >= 1 || first.some(c => /[一-龥（）()A-Za-z]/.test(c) && !/^\d+$/.test(c));

  if (hasHeader) {
    const head = first.map(stuHeaderToField);
    return aoa.slice(1).map(row => {
      const o = {}; head.forEach((h, i) => { o[h] = (row[i] == null ? '' : String(row[i]).trim()); });
      return o;
    });
  } else {
    // 无表头：按学号/姓名/性别/班级/专业/年级/学院/辅导员/手机/宿舍 的固定列序兜底
    const defHead = ['student_number','full_name','gender','class_name','major_name','grade','college_name','counselor_name','phone','dorm'];
    return aoa.map(row => {
      const o = {}; defHead.forEach((h, i) => { o[h] = (row[i] == null ? '' : String(row[i]).trim()); });
      return o;
    });
  }
}

/* 解析 .csv / .txt 文本 → rows-of-objects（沿用 parseCSV + 同义词） */
function csvTextToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const head = rows[0].map(c => String(c == null ? '' : c).trim()).map(stuHeaderToField);
  if (!head.includes('full_name') && !head.includes('student_number')) {
    // 没识别到关键字段，可能首行不是表头
    const defHead = ['student_number','full_name','gender','class_name','major_name','grade','college_name','counselor_name','phone','dorm'];
    return rows.map(row => {
      const o = {}; defHead.forEach((h, i) => { o[h] = (row[i] == null ? '' : String(row[i]).trim()); });
      return o;
    });
  }
  return rows.slice(1).map(row => {
    const o = {}; head.forEach((h, i) => { o[h] = (row[i] == null ? '' : String(row[i]).trim()); });
    return o;
  });
}

/* 单行归一化：缺值容错 + 字段类型清洗 */
function stuNormalizeRow(o) {
  const out = {
    student_number: String(o.student_number || '').trim(),
    full_name: String(o.full_name || '').trim(),
    gender: o.gender ? String(o.gender).trim() : '',
    class_name: o.class_name ? String(o.class_name).trim() : '',
    major_name: o.major_name ? String(o.major_name).trim() : '',
    grade: o.grade ? String(o.grade).trim() : '',
    college_name: o.college_name ? String(o.college_name).trim() : '',
    counselor_name: o.counselor_name ? String(o.counselor_name).trim() : '',
    enrollment_status: o.enrollment_status ? String(o.enrollment_status).trim() : '在读',
    politics: o.politics ? String(o.politics).trim() : '',
    phone: o.phone ? String(o.phone).trim() : '',
    dorm: o.dorm ? String(o.dorm).trim() : '',
    birthday: o.birthday ? String(o.birthday).trim() : '',
    hometown: o.hometown ? String(o.hometown).trim() : '',
    home_addr: o.home_addr ? String(o.home_addr).trim() : '',
    parent_name: o.parent_name ? String(o.parent_name).trim() : '',
    parent_phone: o.parent_phone ? String(o.parent_phone).trim() : '',
    edu_years: o.edu_years != null && o.edu_years !== '' ? stuNum(o.edu_years, '') : '',
    nation: o.nation ? String(o.nation).trim() : '',
    id_card: o.id_card ? String(o.id_card).trim() : '',
    email: o.email ? String(o.email).trim() : '',
    qq: o.qq ? String(o.qq).trim() : '',
    note: o.note ? String(o.note).trim() : '',
  };
  return out;
}

/* 主入口：识别扩展名 → 解析 → 预览 → 用户确认 → 合并写入 */
async function importStudentsFile(file) {
  const name = (file.name || '').toLowerCase();
  const ext = name.includes('.') ? name.split('.').pop() : '';
  const isExcel = ext === 'xls' || ext === 'xlsx' || /xls/i.test(file.type);

  ui.toast('正在解析文件…', 'ok', 1200);

  let raw = [];
  try {
    if (isExcel) {
      await loadSheetJS();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      raw = xlsxRowsToObjects(wb);
    } else {
      const text = await file.text();
      raw = csvTextToObjects(text);
    }
  } catch (e) {
    if (isExcel) {
      ui.toast('xls/xlsx 解析失败：' + (e.message || e) + '。离线时请用 CSV 导入。', 'err', 4800);
    } else {
      ui.toast('文件解析失败：' + (e.message || e), 'err', 4000);
    }
    return;
  }

  if (!raw.length) { ui.toast('文件里没有可识别的数据行', 'err', 3200); return; }

  const norm = raw.map(stuNormalizeRow);
  const valid = norm.filter(r => r.student_number || r.full_name);
  const skipped = norm.length - valid.length;
  const dupSet = new Set();
  const unique = [];
  valid.forEach(r => {
    const k = r.student_number || ('@' + r.full_name);
    if (dupSet.has(k)) return;
    dupSet.add(k);
    unique.push(r);
  });

  // 跟现有库比对
  const existByNo = new Map();
  DB.students.forEach(s => { if (s.student_number) existByNo.set(s.student_number, s); });
  let add = 0, upd = 0, err = 0;
  unique.forEach(r => {
    if (!r.student_number && !r.full_name) { err++; return; }
    if (r.student_number && existByNo.has(r.student_number)) {
      const ex = existByNo.get(r.student_number);
      Object.keys(r).forEach(k => { if (r[k] !== '' && r[k] != null) ex[k] = r[k]; });
      upd++;
    } else {
      const fresh = normStudent(r);
      DB.students.push(fresh);
      if (r.student_number) existByNo.set(r.student_number, fresh);
      add++;
    }
  });

  save('students'); render();
  const dup = valid.length - unique.length;
  const tail = [];
  if (skipped) tail.push('跳过 ' + skipped + ' 条（无学号/姓名）');
  if (dup) tail.push('文件内重复 ' + dup + ' 条（已合并）');
  ui.toast(`导入完成：新增 ${add}，更新 ${upd}` + (tail.length ? '（' + tail.join('，') + '）' : ''), 'ok', 3600);
}

function impCoerce(cfg, o) {
  Object.keys(cfg.cast || {}).forEach(f => { if (o[f]) o[f] = REV[cfg.cast[f]](o[f]); });
  (cfg.bool || []).forEach(f => { if (f in o) o[f] = REV.bool(o[f]); });
  (cfg.num || []).forEach(f => {
    if (!(f in o)) return;
    const v = String(o[f]).replace(/[^\d.\-]/g, '');
    o[f] = v === '' ? '' : Number(v);
  });
}

function genericHeaderKey(value) { return String(value || '').toLowerCase().replace(/[\s_\-（）()\[\]【】]/g, ''); }
function genericHeaderToField(raw, cfg) {
  const clean = String(raw == null ? '' : raw).replace(/^\uFEFF/, '').trim();
  const p = cfg.head.indexOf(clean); if (p >= 0) return cfg.field[p];
  if (cfg.field.includes(clean)) return clean;
  const m = clean.match(/\(([a-z_]+)\)\s*$/i); if (m && cfg.field.includes(m[1])) return m[1];
  const key = genericHeaderKey(clean);
  for (let i = 0; i < cfg.head.length; i++) {
    const h = genericHeaderKey(cfg.head[i]);
    if (h && (key === h || key.includes(h) || h.includes(key))) return cfg.field[i];
  }
  const common = {姓名:'name',学生姓名:'name',标题:'title',名称:'name',内容:'content',正文:'content',分类:'category',类型:'type',来源:'source',备注:'note',标签:'tags',日期:'date',状态:'status',学号:'student_number'};
  const hit = Object.keys(common).find(k => key.includes(genericHeaderKey(k)));
  return hit && cfg.field.includes(common[hit]) ? common[hit] : '';
}
function importCollectionCSV(coll, text) {
  const cfg = IMP[coll];
  if (!cfg) { ui.toast('该模块暂不支持 CSV 导入', 'err'); return; }
  let rows;
  try { rows = parseCSV(text); } catch (err) { ui.toast('文件解析失败：' + err.message, 'err', 3600); return; }
  rows = (rows || []).filter(r => r && r.some(c => String(c == null ? '' : c).trim() !== ''));
  if (rows.length < 2) { ui.toast('文件里没有数据行', 'err'); return; }
  /* 表头识别：支持中文表头、英文字段名、以及「中文(字段名)」三种写法 */
  const idx = {};
  rows[0].forEach((h, i) => {
    const f = genericHeaderToField(h, cfg);
    if (f && !(f in idx)) idx[f] = i;
  });
  const cols = Object.keys(idx);
  const main = cfg.main || cfg.field[0];
  if (!cols.length || !(main in idx)) {
    ui.toast(`表头无法识别，请先点「模板」下载模板，或直接把本模块导出的 CSV 填好再导回`, 'err', 4600); return;
  }
  const before = JSON.parse(JSON.stringify(DB[coll] || []));
  const list = DB[coll] = DB[coll] || [];
  let add = 0, upd = 0, skip = 0;
  rows.slice(1).forEach(r => {
    const o = {};
    cols.forEach(f => { o[f] = String(r[idx[f]] == null ? '' : r[idx[f]]).trim(); });
    if (!o[main]) { skip++; return; }
    impCoerce(cfg, o);
    const usable = cfg.key.filter(k => k in o);
    const ex = usable.length === cfg.key.length
      ? list.find(x => cfg.key.every(k => String(x[k] == null ? '' : x[k]) === String(o[k] == null ? '' : o[k])))
      : null;
    if (ex) {
      Object.keys(o).forEach(k => { if (o[k] !== '' && o[k] !== undefined) ex[k] = o[k]; });
      ex._demo = false; upd++;
    } else {
      const n = cfg.norm(o); n._demo = false; list.push(n); add++;
    }
  });
  save(coll); render();
  if (typeof importer !== 'undefined') { importer._history.push({ id:uid(), coll, before, at:new Date().toISOString(), preview:importer.previewCSV(text, coll) }); if (importer._history.length > 10) importer._history.shift(); }
  ui.toast(`「${cfg.label}」导入完成：新增 ${add} 条，更新 ${upd} 条${skip ? '，跳过空行 ' + skip : ''}`, 'ok', 3400);
}

const importer = {
  _history: [],
  previewCSV(text, coll) {
    const rows = parseCSV(String(text || ''));
    const headers = rows[0] || [];
    const target = coll || Object.keys(IMP).map(k => {
      const cfg = IMP[k];
      const score = headers.reduce((n, h) => n + (genericHeaderToField(h, cfg) ? 1 : 0), 0);
      return { k, score };
    }).sort((a, b) => b.score - a.score)[0].k || 'material';
    const cfg = IMP[target] || IMP.material;
    const mapped = headers.map(h => genericHeaderToField(h, cfg));
    const rowsOut = rows.slice(1).filter(r => r.some(v => String(v || '').trim() !== '')).map(r => {
      const out = {}; mapped.forEach((f, i) => { if (f) out[f] = String(r[i] == null ? '' : r[i]).trim(); }); return out;
    });
    const main = cfg.main || cfg.field[0];
    return { coll:target, label:cfg.label, headers, mapped, rows:rowsOut, total:rowsOut.length, valid:rowsOut.filter(r => !!r[main]).length, skipped:rowsOut.filter(r => !r[main]).length };
  },
  commitCSV(coll, text) {
    const preview = this.previewCSV(text, coll);
    if (!preview.valid) return Object.assign({}, preview, { runId:'' });
    const before = this._history.length;
    importCollectionCSV(coll, text);
    const run = this._history.length > before ? this._history[this._history.length - 1] : null;
    return Object.assign({}, preview, { runId: run ? run.id : '' });
  },
  undo(runId) {
    const i = this._history.findIndex(x => x.id === runId);
    if (i < 0) return false;
    const run = this._history[i]; DB[run.coll] = run.before; save(run.coll); render(); this._history.splice(i, 1); return true;
  },
  getHistory() { return this._history.slice(); },
};

const security = {

    }, timeout);
  },
  touch() {

  configure(pass) {

/* ---------- 全局搜索 ---------- */
const GS_VIEWS = [
  { v: 'students', ic: 'i-users', name: '学生台账', fields: s => [s.full_name, s.student_id, s.student_number, s.class_name, s.dorm, s.phone] },
  { v: 'tasks', ic: 'i-task', name: '工作任务', fields: t => [t.title, t.note, t.classes, t.source] },
  { v: 'talks', ic: 'i-talk', name: '谈心谈话', fields: t => [t.student_name, t.content, t.topic] },
  { v: 'stay', ic: 'i-home', name: '校外住宿', fields: x => [x.full_name, x.student_number, x.reason, x.address] },
  { v: 'leave', ic: 'i-plane', name: '假期去向', fields: x => [x.full_name, x.student_number, x.dest, x.reason] },
  { v: 'honor', ic: 'i-trophy', name: '评优榜样', fields: x => [x.full_name, x.student_number, x.title, x.award] },
  { v: 'warn', ic: 'i-alert', name: '学业预警', fields: x => [x.full_name, x.student_number, x.course, x.note] },
  { v: 'grant', ic: 'i-grad', name: '奖助勤补', fields: x => [x.full_name, x.student_number, x.type, x.name] },
];
function runGlobalSearch(raw) {
  const term = (raw || '').trim(), q = term.toLowerCase();
  const panel = $('#gs-panel'); if (!panel) return;
  if (!q) { hideSearch(); return; }
  const out = [];
  GS_VIEWS.forEach(({ v, ic, name, fields }) => {
    const arr = DB[v]; if (!Array.isArray(arr)) return;
    arr.forEach(it => {
      const hay = fields(it).join(' ').toLowerCase();
      if (hay.includes(q)) out.push({ v, ic, name, title: (it.full_name || it.student_name || it.title || it.name || '记录'), sub: v === 'tasks' ? (it.classes || it.source || '') : (it.student_number || it.date || '') });
    });
  });
  if (!out.length) { panel.innerHTML = `<div class="gs-empty">没有匹配「${esc(term)}」的结果</div>`; panel.hidden = false; return; }
  const groups = {};
  out.slice(0, 24).forEach(r => { (groups[r.v] = groups[r.v] || []).push(r); });
  let html = '';
  Object.keys(groups).forEach(v => {
    html += `<div class="gs-group">${esc(groups[v][0].name)} · ${groups[v].length}</div>`;
    html += groups[v].map(r => `<div class="gs-item" data-gv="${v}" data-gq="${esc(term)}">
      <span class="gs-ic"><svg class="ic"><use href="#${r.ic}"/></svg></span>
      <span class="gs-main"><span class="gs-t">${esc(r.title)}</span>${r.sub ? `<span class="gs-s">${esc(r.sub)}</span>` : ''}</span></div>`).join('');
  });
  panel.innerHTML = html + `<div class="gs-foot">回车跳转首个结果 · Esc 关闭</div>`;
  panel.hidden = false;
}
function hideSearch() { const p = $('#gs-panel'); if (p) { p.hidden = true; p.innerHTML = ''; } }

document.addEventListener('click', e => {
  const it = e.target.closest('.gs-item');
  if (it) {
    const v = it.dataset.gv;
    app.filters[v] = app.filters[v] || {};
    app.filters[v].q = it.dataset.gq || '';
    go(v); hideSearch();
    const inp = $('#global-search'); if (inp) inp.blur();
    return;
  }

document.addEventListener('click', e => {

document.addEventListener('input', e => {

    app.filters[g][k] = f.value;

    }, 260);

});

/* B1 微交互：按钮点击涟漪（克制、0.42s 淡出） */
document.addEventListener('click', e => {
  const b = e.target.closest('.btn');
  if (b && !b.disabled && !b.classList.contains('btn-icon')) {
    const r = document.createElement('span'); r.className = 'ripple';
    const rect = b.getBoundingClientRect();
    const sz = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = sz + 'px';
    const cx = (e.clientX || rect.left + rect.width / 2) - rect.left - sz / 2;
    const cy = (e.clientY || rect.top + rect.height / 2) - rect.top - sz / 2;
    r.style.left = cx + 'px'; r.style.top = cy + 'px';
    b.appendChild(r);
    setTimeout(() => r.remove(), 440);
  }
});

const customModules = {};
const modules = {
  register(def) {
    if (!def || !def.key || typeof def.render !== 'function') throw new Error('模块需要 key 和 render()');
    customModules[def.key] = def;
    VIEWS[def.key] = def.render;
    const nav = $('#sidenav');

    btn.className = 'nav-item'; btn.dataset.view = def.key;
    btn.innerHTML = `<svg class="ic"><use href="#${def.icon || 'i-flag'}"/></svg>${esc(def.name || def.key)}`;
    nav.insertBefore(btn, $('.nav-foot', nav));
    hooks.emit('module:register', def);
    return def;
  },
  list() { return Object.keys(customModules); }
};

function injectNavExtras() {
  $$('#sidenav .nav-item').forEach(it => {
    if (it.querySelector('.nav-pin')) return;
    const v = it.dataset.view;
    const pin = document.createElement('button');
    pin.className = 'nav-pin'; pin.dataset.pin = v; pin.title = '钉到常用 / 取消钉住';
    pin.innerHTML = '<svg class="ic"><use href="#i-pin"/></svg>';
    it.appendChild(pin);
  });
}
function applyFold() {
  const g = DB.settings.navFold || {};
  $$('#sidenav > .nav-group').forEach(grp => {
    const name = grp.dataset.group;
    const collapsed = !!g[name];
    grp.classList.toggle('collapsed', collapsed);
    let n = grp.nextElementSibling;
    while (n && !n.classList.contains('nav-group')) {
      if (n.classList.contains('nav-item')) n.style.display = collapsed ? 'none' : '';
      n = n.nextElementSibling;
    }
  });
}
function updatePinStates() {
  const pinned = DB.settings.pinned || [];
  $$('#sidenav .nav-item[data-view]').forEach(it => {
    it.classList.toggle('pinned', pinned.indexOf(it.dataset.view) >= 0);
  });
}
function renderPinned() {
  const box = $('#nav-pinned'); if (!box) return;
  const pinned = DB.settings.pinned || [];
  if (!pinned.length) { box.innerHTML = ''; return; }
  const html = {};
  $$('#sidenav .nav-item[data-view]').forEach(it => {
    const v = it.dataset.view;
    if (pinned.indexOf(v) >= 0) html[v] = it.innerHTML;
  });
  box.innerHTML = '<div class="nav-group">常用</div>' + pinned.map(v =>
    `<button class="nav-item pinned" data-view="${v}">${html[v] || ''}</button>`).join('');
  updatePinStates();
}
function toggleFold(group) {
  DB.settings.navFold = DB.settings.navFold || {};
  DB.settings.navFold[group] = !DB.settings.navFold[group];
  save('settings'); applyFold();
}
function togglePin(view) {
  DB.settings.pinned = DB.settings.pinned || [];
  const i = DB.settings.pinned.indexOf(view);
  if (i >= 0) DB.settings.pinned.splice(i, 1); else DB.settings.pinned.push(view);
  save('settings'); renderPinned(); updatePinStates();
  ui.toast(i >= 0 ? '已取消常用' : '已钉到常用', 'ok', 1200);
}
function bindNavSearch() {
  const inp = $('#nav-search'); if (!inp || inp._bound) return; inp._bound = 1;
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    const folded = DB.settings.navFold || {};
    $$('#sidenav > .nav-group').forEach(grp => {
      const collapsed = !!folded[grp.dataset.group];
      let n = grp.nextElementSibling, any = false;
      while (n && !n.classList.contains('nav-group')) {
        if (n.classList.contains('nav-item')) {
          if (collapsed) { n.style.display = 'none'; }
          else {
            const txt = (n.textContent || '').replace(/[\s★]/g, '').toLowerCase();
            n.style.display = (!q || txt.indexOf(q) >= 0) ? '' : 'none';
          }
          if (n.style.display !== 'none') any = true;
        }
        n = n.nextElementSibling;
      }
      grp.style.display = (collapsed || any) ? '' : 'none';
    });
    const pb = $('#nav-pinned'); if (pb) pb.style.display = q ? 'none' : '';
  });
}
