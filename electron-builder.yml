appId: cn.counselordesk.workbench
productName: 辅导员工作台
executableName: counselor-desk
artifactName: counselor-desk-${version}-${arch}.${ext}
icon: assets/app-icon.svg
directories:
  output: output/desktop
  buildResources: assets
npmRebuild: false
files:
  - desktop/**
  - index.html
  - src/core/v4-runtime.js
  - src/core/import-worker.js
  - vendor/xlsx.full.min.js
  - vendor/argon2-bundled.min.js
  - vendor/jszip.min.js
  - vendor/echarts.min.js
  - THIRD-PARTY-NOTICES.md
win:
  target:
    - msi
  requestedExecutionLevel: asInvoker
msi:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 辅导员工作台
  runAfterFinish: true
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: counselor-desk-${version}-mac-${arch}.${ext}
