<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="辅导员工作台 Counselor Desk Banner">
  <defs>
    <!-- 主背景：深空航蓝渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3a82"/>
      <stop offset="50%" stop-color="#082a78"/>
      <stop offset="100%" stop-color="#051a4a"/>
    </linearGradient>
    <!-- 信号青径向光晕 -->
    <radialGradient id="signal" cx="0.85" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#0bb4c4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0bb4c4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0bb4c4" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝图网格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5a90d6" stroke-width="0.4" stroke-opacity="0.18"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#5a90d6" stroke-width="0.7" stroke-opacity="0.28"/>
    </pattern>
    <!-- 文字渐变 -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a3d5e0"/>
      <stop offset="100%" stop-color="#0bb4c4"/>
    </linearGradient>
  </defs>

  <!-- 背景层 -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#gridMajor)"/>
  <rect width="1280" height="360" fill="url(#signal)"/>

  <!-- 装饰：航空飞行轨迹（呼应「低空学院」） -->
  <g opacity="0.4" stroke="#0bb4c4" fill="none" stroke-linecap="round">
    <path d="M -20 280 Q 320 180 640 240 T 1300 160" stroke-width="1.2" stroke-dasharray="3 5"/>
    <path d="M -20 320 Q 400 240 720 300 T 1300 240" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.6"/>
  </g>

  <!-- 装饰：右侧机翼/坐标标尺 -->
  <g transform="translate(1000, 60)" stroke="#0bb4c4" stroke-width="1" fill="none" opacity="0.7">
    <line x1="0" y1="0" x2="240" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="240"/>
    <g stroke-width="0.6">
      <line x1="0" y1="40" x2="240" y2="40"/>
      <line x1="0" y1="80" x2="240" y2="80"/>
      <line x1="0" y1="120" x2="240" y2="120"/>
      <line x1="0" y1="160" x2="240" y2="160"/>
      <line x1="0" y1="200" x2="240" y2="200"/>
      <line x1="40" y1="0" x2="40" y2="240"/>
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="120" y1="0" x2="120" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="240"/>
    </g>
    <circle cx="120" cy="120" r="40" stroke-width="1.4"/>
    <circle cx="120" cy="120" r="60" stroke-width="0.8" opacity="0.6"/>
    <circle cx="120" cy="120" r="3" fill="#0bb4c4"/>
  </g>

  <!-- 装饰：左侧数据坐标点 -->
  <g transform="translate(60, 60)" fill="#0bb4c4" opacity="0.85">
    <circle cx="0" cy="0" r="3"/>
    <circle cx="20" cy="14" r="2"/>
    <circle cx="40" cy="8" r="2.5"/>
    <circle cx="60" cy="22" r="2"/>
    <circle cx="80" cy="12" r="3"/>
    <circle cx="100" cy="28" r="2"/>
    <circle cx="120" cy="18" r="2.5"/>
    <circle cx="140" cy="32" r="2"/>
    <circle cx="160" cy="20" r="2.5"/>
  </g>

  <!-- 主标题 -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="Inter, -apple-system, 'PingFang SC', sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">辅导员工作台</text>
    <text x="0" y="50" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#a3d5e0" letter-spacing="3">COUNSELOR  DESK</text>
  </g>

  <!-- 副标题 -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="Inter, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#e3f7f9">为一线辅导员而生 · 让重复的事变简单</text>
    <text x="0" y="28" font-family="Inter, 'PingFang SC', sans-serif" font-size="14" font-weight="400" fill="#8aa8c4" letter-spacing="0.5">单文件 HTML · 零依赖 · 离线可用 · v3.8.0</text>
  </g>

  <!-- 标签胶囊：低空学院·工程版 -->
  <g transform="translate(60, 305)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#0bb4c4" fill-opacity="0.15" stroke="#0bb4c4" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#0bb4c4"/>
    <text x="28" y="21" font-family="Inter, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#a3d5e0">低空学院 · 工程版</text>
  </g>

  <!-- 标签胶囊：19 模块 -->
  <g transform="translate(250, 305)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="21" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#c7d6ef">19 个业务模块</text>
  </g>

  <!-- 标签胶囊：4 套测试 PASS -->
  <g transform="translate(390, 305)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#12a06b" fill-opacity="0.18" stroke="#12a06b" stroke-width="1"/>
    <path d="M 14 16 L 18 20 L 26 12" fill="none" stroke="#3fd6a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="21" font-family="Inter, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#3fd6a4">4 套测试全 PASS</text>
  </g>

  <!-- 标签胶囊：MIT -->
  <g transform="translate(570, 305)">
    <rect x="0" y="0" width="80" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="40" y="21" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#c7d6ef">MIT</text>
  </g>

  <!-- 装饰：底部工程刻度尺 -->
  <g transform="translate(60, 340)" stroke="#0bb4c4" stroke-width="0.8" opacity="0.6">
    <line x1="0" y1="0" x2="1160" y2="0"/>
    <g>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="200" y1="-2" x2="200" y2="2"/>
      <line x1="400" y1="-2" x2="400" y2="2"/>
      <line x1="600" y1="-3" x2="600" y2="3"/>
      <line x1="800" y1="-2" x2="800" y2="2"/>
      <line x1="1000" y1="-2" x2="1000" y2="2"/>
      <line x1="1160" y1="-3" x2="1160" y2="3"/>
    </g>
  </g>
</svg>
