<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="辅导员工作台 Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3a82"/>
      <stop offset="100%" stop-color="#082a78"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0bb4c4"/>
      <stop offset="100%" stop-color="#0d8ce0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0bb4c4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0bb4c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="120" cy="120" r="120" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="120" fill="url(#glow)"/>

  <!-- 工程蓝图网格 -->
  <g stroke="#5a90d6" stroke-width="0.4" stroke-opacity="0.25" fill="none">
    <line x1="0" y1="40" x2="240" y2="40"/>
    <line x1="0" y1="80" x2="240" y2="80"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="160" x2="240" y2="160"/>
    <line x1="0" y1="200" x2="240" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
  </g>

  <!-- 主图形：航空仪表盘 + 心形（关怀学生） -->
  <g transform="translate(120, 120)">
    <!-- 外环 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#0bb4c4" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#0bb4c4" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0bb4c4" stroke-width="1" stroke-opacity="0.25"/>

    <!-- 刻度 -->
    <g stroke="#0bb4c4" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-78" x2="0" y2="-66"/>
      <line x1="55" y1="-55" x2="47" y2="-47"/>
      <line x1="78" y1="0" x2="66" y2="0"/>
      <line x1="55" y1="55" x2="47" y2="47"/>
      <line x1="0" y1="78" x2="0" y2="66"/>
      <line x1="-55" y1="55" x2="-47" y2="47"/>
      <line x1="-78" y1="0" x2="-66" y2="0"/>
      <line x1="-55" y1="-55" x2="-47" y2="-47"/>
    </g>

    <!-- 中央：人形剪影 + 关怀心形 -->
    <!-- 人头 -->
    <circle cx="0" cy="-22" r="14" fill="url(#accent)"/>
    <!-- 人身 -->
    <path d="M -28 36 Q -28 6 0 6 Q 28 6 28 36 L 28 44 L -28 44 Z" fill="url(#accent)"/>

    <!-- 心形装饰（关怀） -->
    <g transform="translate(38, -38) scale(0.18)">
      <path d="M 0 12 C -8 0, -28 0, -28 -16 C -28 -32, -12 -36, 0 -22 C 12 -36, 28 -32, 28 -16 C 28 0, 8 0, 0 12 Z" fill="#e0a020" opacity="0.95"/>
    </g>

    <!-- 指针 -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#0bb4c4" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="32" stroke="#a3d5e0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- 底部光晕 -->
  <ellipse cx="120" cy="220" rx="80" ry="6" fill="#0bb4c4" opacity="0.3"/>
</svg>
